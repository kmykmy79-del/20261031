<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>정보 컴퓨터 교과교재개발론</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <!-- ═══════ ① 디자인 — 색상은 아래 :root에서 바꿉니다 ═══════ -->
  <style>
/* ── 색상·크기 토큰 (분위기를 바꾸려면 여기만 고치세요) ── */
:root {
  --sky-50: #f1f8ff;
  --sky-100: #dcefff;
  --sky-200: #bcdcfb;
  --sky-400: #4ea8ef;
  --sky-500: #1f86dc;
  --aqua-100: #dbf4f8;
  --aqua-200: #b9e8ef;
  --aqua-400: #3cc2d7;
  --navy-500: #2f74cf;
  --navy-700: #173f7a;

  --bg: #f6faff;
  --surface: #ffffff;
  --text: #1d2d44;
  --text-soft: #5b6b82;
  --line: #dfe9f4;
  --accent: var(--sky-500);
  --accent-2: var(--navy-500);
  --grad: linear-gradient(135deg, var(--sky-400), var(--aqua-400));

  --radius: 24px;
  --radius-sm: 14px;
  --shadow: 0 10px 30px rgba(60, 120, 190, 0.12);
  --shadow-hover: 0 16px 40px rgba(60, 120, 190, 0.22);
  --header-h: 68px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  word-break: keep-all;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
ul, ol { list-style: none; }

.container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.container.narrow { max-width: 800px; }
.mt { margin-top: 20px; }

/* ── 헤더 ─────────────────────────────────── */
.site-header {
  position: fixed; inset: 0 0 auto 0; z-index: 100;
  height: var(--header-h);
  background: rgba(246, 250, 255, 0.75);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  transition: box-shadow .3s, border-color .3s, background .3s;
}
.site-header.scrolled {
  background: rgba(246, 250, 255, 0.92);
  border-color: var(--line);
  box-shadow: 0 4px 20px rgba(60, 120, 190, 0.1);
}
.header-inner { height: 100%; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.site-nav { order: 2; }
.lock-btn {
  order: 3; flex: none; width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; font-size: 18px; transition: background .2s, box-shadow .2s;
}
.lock-btn:hover { background: var(--sky-100); }
.lock-btn.on { background: var(--grad); border-color: transparent; box-shadow: 0 4px 14px rgba(31, 134, 220, 0.35); }
.menu-toggle { order: 4; }
.brand-logo {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 20px;
  background: var(--grad);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-text b { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text small { font-size: 12px; color: var(--text-soft); }

.site-nav { display: flex; gap: 4px; }
.site-nav a {
  padding: 8px 14px; border-radius: 999px;
  font-size: 15px; font-weight: 500; color: var(--text-soft);
  transition: background .2s, color .2s;
}
.site-nav a:hover { background: var(--sky-100); color: var(--text); }
.site-nav a.active { background: var(--grad); color: #fff; }

.menu-toggle {
  display: none; width: 44px; height: 44px; flex: none;
  border: 0; border-radius: 12px; background: var(--sky-100); cursor: pointer;
  flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.menu-toggle span { width: 20px; height: 2px; border-radius: 2px; background: var(--navy-700); transition: transform .25s, opacity .25s; }
.menu-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.menu-toggle.open span:nth-child(2) { opacity: 0; }
.menu-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── 히어로 ───────────────────────────────── */
.hero {
  position: relative; overflow: hidden;
  padding: calc(var(--header-h) + 64px) 0 72px;
  background:
    radial-gradient(circle at 15% 20%, var(--sky-100), transparent 45%),
    radial-gradient(circle at 85% 30%, var(--aqua-100), transparent 45%),
    linear-gradient(180deg, var(--sky-50), var(--bg));
  text-align: center;
}
.hero-inner { position: relative; z-index: 1; }
.hero-meta { font-size: 14px; color: var(--text-soft); margin-bottom: 14px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 18px; border-radius: 999px;
  background: #fff; border: 1px solid var(--sky-200);
  box-shadow: 0 4px 14px rgba(31, 134, 220, 0.15);
  font-size: 14px; font-weight: 700; color: var(--navy-700);
}
.badge::before { content: "✨"; }
.hero h1 {
  margin: 22px 0 6px;
  font-size: clamp(34px, 7vw, 64px); font-weight: 800; line-height: 1.25;
  background: linear-gradient(135deg, var(--sky-500), var(--navy-700));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-subtitle {
  font-size: clamp(18px, 3vw, 26px); font-weight: 700; color: var(--navy-700);
  margin-bottom: 18px;
}
.hero-desc { max-width: 680px; margin: 0 auto; font-size: clamp(15px, 2.1vw, 18px); color: var(--text-soft); }
.hero-buttons { display: flex; justify-content: center; gap: 12px; margin: 32px auto 44px; max-width: 440px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 52px; padding: 0 28px; border-radius: 999px;
  font-weight: 700; font-size: 16px; transition: transform .2s, box-shadow .2s;
  flex: 1 1 0; white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 8px 22px rgba(31, 134, 220, 0.35); }
.btn-ghost { background: #fff; color: var(--navy-700); border: 1px solid var(--aqua-200); }

/* 한눈에 보기 */
.quick-info {
  display: grid; grid-template-columns: repeat(4, 1fr);
  max-width: 980px; margin: 0 auto; padding: 8px;
  text-align: left;
}
.quick-info li { display: flex; align-items: center; gap: 14px; padding: 18px 20px; }
.quick-info li + li { border-left: 1px dashed var(--line); }
.quick-info .qi-icon {
  flex: none; width: 46px; height: 46px; border-radius: 14px;
  display: grid; place-items: center; font-size: 22px;
  background: linear-gradient(135deg, var(--sky-100), var(--aqua-100));
}
.quick-info span { display: block; font-size: 13px; color: var(--text-soft); }
.quick-info strong { display: block; font-size: 15px; line-height: 1.45; }

/* 떠오르는 물방울 */
.petals i {
  position: absolute; bottom: -40px; width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, var(--sky-200) 60%, var(--sky-400));
  opacity: .55;
  animation: fall linear infinite;
}
.petals i:nth-child(odd) { width: 10px; height: 10px; background: radial-gradient(circle at 30% 30%, #fff, var(--aqua-200) 60%, var(--aqua-400)); }
.petals i:nth-child(3n) { width: 22px; height: 22px; }
.petals i:nth-child(1)  { left: 5%;  animation-duration: 11s; animation-delay: 0s; }
.petals i:nth-child(2)  { left: 13%; animation-duration: 14s; animation-delay: 3s; }
.petals i:nth-child(3)  { left: 22%; animation-duration: 10s; animation-delay: 6s; }
.petals i:nth-child(4)  { left: 31%; animation-duration: 15s; animation-delay: 1s; }
.petals i:nth-child(5)  { left: 40%; animation-duration: 12s; animation-delay: 8s; }
.petals i:nth-child(6)  { left: 50%; animation-duration: 13s; animation-delay: 4s; }
.petals i:nth-child(7)  { left: 59%; animation-duration: 11s; animation-delay: 9s; }
.petals i:nth-child(8)  { left: 68%; animation-duration: 16s; animation-delay: 2s; }
.petals i:nth-child(9)  { left: 77%; animation-duration: 12s; animation-delay: 5s; }
.petals i:nth-child(10) { left: 85%; animation-duration: 14s; animation-delay: 7s; }
.petals i:nth-child(11) { left: 92%; animation-duration: 10s; animation-delay: 2.5s; }
.petals i:nth-child(12) { left: 97%; animation-duration: 15s; animation-delay: 10s; }
@keyframes fall {
  0%   { transform: translate(0, 0); opacity: 0; }
  15%  { opacity: .6; }
  50%  { transform: translate(24px, -55vh); }
  100% { transform: translate(-16px, -110vh); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .petals { display: none; }
}

/* ── 공통 섹션 · 카드 ─────────────────────── */
.section { padding: 88px 0; scroll-margin-top: var(--header-h); }
.section-tint { background: linear-gradient(180deg, var(--sky-50), var(--aqua-100) 140%); }
.section-head { text-align: center; margin-bottom: 40px; }
.section-head h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; }
.section-head h2::after {
  content: ""; display: block; width: 48px; height: 4px; margin: 12px auto 0;
  border-radius: 4px; background: var(--grad);
}
.section-head p { margin-top: 14px; color: var(--text-soft); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  transition: transform .25s, box-shadow .25s;
}
.card h3 { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
.card p { color: var(--text-soft); font-size: 15px; }

.grid { display: grid; gap: 20px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }

.icon {
  width: 52px; height: 52px; margin-bottom: 16px; border-radius: 16px;
  display: grid; place-items: center; font-size: 26px;
  background: linear-gradient(135deg, var(--sky-100), var(--aqua-100));
}
.hover-lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

/* ── 통계 카드 ────────────────────────────── */
.stats-section { padding: 0 0 24px; margin-top: -8px; position: relative; z-index: 2; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.stat { text-align: center; padding: 28px 16px; }
.stat-icon { font-size: 26px; }
.stat-num {
  display: block; margin: 6px 0 2px;
  font-size: clamp(34px, 5vw, 46px); font-weight: 800; line-height: 1.15;
  background: linear-gradient(135deg, var(--sky-500), var(--navy-500));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  font-variant-numeric: tabular-nums;
}
.stat-num small { font-size: .5em; margin-left: 2px; }
.stat-label { font-size: 15px; color: var(--text-soft); }

/* ── 장점 슬라이드 ────────────────────────── */
.slider { position: relative; }
.slider-track {
  --per-view: 3;
  display: flex; gap: 20px;
  overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
  padding: 8px 4px 24px; margin: 0 -4px;
  scrollbar-width: none;
}
.slider-track::-webkit-scrollbar { display: none; }
.slider-track:focus-visible { outline: 3px solid var(--aqua-400); outline-offset: 2px; border-radius: var(--radius); }
.slide {
  flex: 0 0 calc((100% - (var(--per-view) - 1) * 20px) / var(--per-view));
  scroll-snap-align: start;
  background: linear-gradient(160deg, #fff 55%, var(--sky-50));
}
.slide-no { float: right; font-size: 13px; font-weight: 700; color: var(--aqua-400); }
.slider-controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 4px; }
.slider-btn {
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--aqua-200); background: #fff; color: var(--navy-700);
  font-size: 18px; font-weight: 700; box-shadow: var(--shadow);
  transition: background .2s, color .2s, opacity .2s;
}
.slider-btn:hover:not(:disabled) { background: var(--grad); color: #fff; border-color: transparent; }
.slider-btn:disabled { opacity: .35; cursor: default; }
.slider-dots { display: flex; gap: 8px; }
.slider-dots button {
  width: 10px; height: 10px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--sky-200); transition: width .25s, background .25s;
}
.slider-dots button.active { width: 28px; background: var(--grad); }

/* 학습 목표 */
.goals { margin-top: 28px; background: linear-gradient(135deg, #fff, var(--sky-50)); }
.goals ol { counter-reset: g; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 24px; margin-top: 8px; }
.goals li { counter-increment: g; position: relative; padding-left: 40px; color: var(--text); }
.goals li::before {
  content: counter(g); position: absolute; left: 0; top: 2px;
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
  background: var(--grad);
}

/* ── 커리큘럼 (주차별 펼치기) ─────────────── */
.curri-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 8px;
}
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--text-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.btn-small {
  min-height: 38px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--aqua-200); background: #fff; color: var(--navy-700);
  font: inherit; font-size: 14px; font-weight: 700; transition: background .2s, color .2s;
}
.btn-small:hover { background: var(--grad); color: #fff; border-color: transparent; }

.phase-block { margin-top: 28px; }
.phase-name {
  display: inline-block; margin-bottom: 12px; padding: 6px 16px; border-radius: 999px;
  background: var(--aqua-100); color: var(--navy-700); font-size: 15px; font-weight: 700;
}
.week-list { display: grid; gap: 12px; }
.week-item { padding: 0; border-radius: 18px; overflow: hidden; scroll-margin-top: calc(var(--header-h) + 16px); }
.week-item summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 16px;
  padding: 16px 20px;
}
.week-item summary::-webkit-details-marker { display: none; }
.week-item summary:hover { background: var(--sky-50); }
.week-no {
  flex: none; width: 56px; height: 56px; border-radius: 16px;
  display: grid; place-items: center; line-height: 1.1; text-align: center;
  background: var(--sky-100); color: var(--sky-500); font-size: 12px; font-weight: 700;
}
.week-no b { display: block; font-size: 20px; }
.week-main { min-width: 0; }
.week-main strong { display: block; font-size: 16px; }
.week-main p { font-size: 14px; color: var(--text-soft); }
.week-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--aqua-100); color: var(--navy-700);
}
.chip-date { background: #fff; border: 1px solid var(--line); color: var(--text-soft); }
.chip-task { background: var(--sky-100); color: var(--sky-500); }
.chip-now { background: var(--grad); color: #fff; }
.chip-done { background: #edf2f7; color: #8695a8; }
.chevron {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--aqua-100); color: var(--navy-700); font-size: 14px; transition: transform .25s;
}
.week-item[open] .chevron { transform: rotate(180deg); }
.week-item.is-current { border-color: var(--sky-400); box-shadow: 0 10px 30px rgba(31, 134, 220, 0.22); }
.week-item.is-current .week-no { background: var(--grad); color: #fff; }
.week-item.is-past .week-no { background: #edf2f7; color: #8695a8; }

.week-body { padding: 4px 20px 22px; border-top: 1px dashed var(--line); }
.info-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.info-pills span {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 12px; background: var(--sky-50); font-size: 14px;
}
.info-pills b { color: var(--text-soft); font-weight: 500; }
.week-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.week-cols h4, .assign h4 { font-size: 15px; margin-bottom: 8px; }
.dot-list li { position: relative; padding-left: 18px; font-size: 15px; margin-bottom: 4px; }
.dot-list li::before {
  content: ""; position: absolute; left: 2px; top: 10px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--sky-400);
}
.video-list { display: grid; gap: 8px; }
.video-list a {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 500;
  transition: border-color .2s, background .2s;
}
.video-list a:hover { border-color: var(--sky-400); background: var(--sky-50); }
.video-list a::before {
  content: "▶"; flex: none; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 10px; color: #fff; background: var(--grad);
}
.muted { font-size: 14px; color: var(--text-soft); }

.assign {
  margin-top: 20px; padding: 20px; border-radius: 18px;
  background: linear-gradient(135deg, var(--sky-50), var(--aqua-100));
  border: 1px dashed var(--sky-400);
}
.assign-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.assign-head h4 { margin: 0; }
.assign p { font-size: 15px; color: var(--text); }
.assign-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.due { font-size: 14px; color: var(--text-soft); }
.due b { color: var(--text); }
.countdown { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #fff; color: var(--navy-700); }
.countdown.soon { background: var(--sky-100); color: var(--sky-500); }
.countdown.urgent { background: #ffe0e3; color: #c93a4f; animation: pulse 1.6s ease-in-out infinite; }
.countdown.closed { background: #edf2f7; color: #8695a8; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(31, 134, 220, 0.15); } }
.btn-submit { flex: none; min-height: 44px; padding: 0 22px; font-size: 15px; border: 0; cursor: pointer; font-family: inherit; }
.btn-submit:disabled { background: #e3e9f0; color: #8695a8; box-shadow: none; cursor: not-allowed; transform: none; }

/* ── 월간 달력 ────────────────────────────── */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.cal { padding: 24px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.cal-head h3 { margin: 0; font-size: 22px; }
.cal-nav { display: flex; gap: 6px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-dow { text-align: center; font-size: 13px; font-weight: 700; color: var(--text-soft); padding: 4px 0; }
.cal-dow:first-child, .cal-day.sun .num { color: #e0607e; }
.cal-dow:last-child, .cal-day.sat .num { color: #7d8fd6; }
.cal-day {
  position: relative; min-height: 88px; padding: 8px; border-radius: 14px; cursor: pointer;
  border: 1px solid transparent; background: #f7fbfe; text-align: left;
  font: inherit; color: var(--text); display: flex; flex-direction: column; gap: 4px;
  transition: background .2s, border-color .2s, transform .15s;
}
.cal-day:hover { border-color: var(--sky-200); }
.cal-day .num { font-size: 14px; font-weight: 700; }
.cal-day.out { opacity: .35; }
.cal-day.has-class { background: linear-gradient(160deg, var(--sky-100), var(--aqua-100)); }
.cal-day.is-today .num {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--navy-700); color: #fff !important;
}
.cal-day.is-selected { border-color: var(--navy-500); box-shadow: 0 0 0 2px var(--aqua-200); }
.cal-class {
  font-size: 11px; font-weight: 700; line-height: 1.3; color: var(--navy-700);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.cal-class em { font-style: normal; color: var(--sky-500); }
.cal-due { font-size: 11px; font-weight: 700; color: #c93a4f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-legend { margin-top: 16px; }

.cal-detail { position: sticky; top: calc(var(--header-h) + 16px); }
.cal-detail h3 { font-size: 20px; }
.cal-detail .detail-date { font-size: 14px; color: var(--accent-2); font-weight: 700; margin-bottom: 4px; }
.cal-detail .info-pills { margin: 12px 0; }
.cal-detail .assign { margin-top: 16px; padding: 16px; }
.detail-empty { text-align: center; padding: 24px 0; color: var(--text-soft); }
.detail-empty div { font-size: 40px; margin-bottom: 8px; }
.link-btn {
  margin-top: 14px; background: none; border: 0; padding: 0; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 700; color: var(--accent);
}
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ── AI 도구 ──────────────────────────────── */
.tool { display: flex; flex-direction: column; }
.tool-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.tool-head .icon { margin: 0; }
.tool-head h3 { margin: 0; }
.tool-tag {
  display: inline-block; margin-top: 2px; padding: 2px 10px; border-radius: 999px;
  background: var(--aqua-100); color: var(--navy-700); font-size: 12px; font-weight: 700;
}
.tool p { flex: 1; }
.tool-link { margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--accent); }
.tool-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ── 수강 안내 ────────────────────────────── */
.prep-list { display: grid; gap: 14px; margin-top: 6px; }
.prep-list li { display: flex; gap: 14px; align-items: flex-start; }
.prep-list .icon { width: 44px; height: 44px; font-size: 22px; margin: 0; border-radius: 12px; flex: none; }
.prep-list strong { display: block; font-size: 16px; }
.prep-list p { font-size: 14px; }
.bars { display: grid; gap: 14px; margin-top: 6px; }
.bar-label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
.bar-label b { color: var(--accent-2); }
.bar { height: 10px; border-radius: 10px; background: var(--sky-50); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 10px; background: var(--grad); }

/* ── FAQ ──────────────────────────────────── */
.faq-list { display: grid; gap: 14px; }
.faq-item { padding: 0; border-radius: var(--radius-sm); }
.faq-item summary {
  list-style: none; cursor: pointer; position: relative;
  padding: 20px 56px 20px 24px; font-weight: 700; font-size: 16px;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::before { content: "Q."; color: var(--accent); margin-right: 8px; }
.faq-item summary::after {
  content: "+"; position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-size: 18px;
  background: var(--aqua-100); color: var(--navy-700); transition: transform .25s;
}
.faq-item[open] summary::after { transform: translateY(-50%) rotate(45deg); }
.faq-item p { padding: 0 24px 22px 50px; }

/* ── 푸터 (교수자 소개) ───────────────────── */
.site-footer {
  scroll-margin-top: var(--header-h);
  padding: 80px 0 0;
  background: linear-gradient(160deg, var(--sky-100), var(--aqua-100) 60%, var(--aqua-200));
}
.footer-title { text-align: center; font-size: clamp(24px, 3.6vw, 32px); font-weight: 800; margin-bottom: 32px; }
.profile { display: flex; gap: 40px; align-items: center; padding: 40px; }
.avatar {
  flex: none; width: 180px; height: 180px; border-radius: 50%; overflow: hidden;
  display: grid; place-items: center; font-size: 80px;
  background: var(--grad); border: 6px solid #fff; box-shadow: var(--shadow);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-body h3 { font-size: 26px; margin-bottom: 2px; }
.position { color: var(--accent-2) !important; font-weight: 500; margin-bottom: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.tag { padding: 4px 14px; border-radius: 999px; background: var(--sky-100); color: var(--sky-500); font-size: 13px; font-weight: 700; }
.contacts { display: grid; gap: 8px; }
.contacts li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 15px; }
.contacts b { color: var(--text-soft); font-weight: 500; min-width: 64px; }
.contacts a { color: var(--navy-700); text-decoration: underline; text-underline-offset: 3px; }
.footer-bottom {
  margin-top: 56px; padding: 24px 0; text-align: center;
  border-top: 1px solid rgba(47, 116, 207, 0.2);
  color: var(--text-soft); font-size: 14px;
}
.footer-bottom p { font-weight: 700; color: var(--text); }

/* ── 맨 위로 ──────────────────────────────── */
.to-top {
  position: fixed; right: 20px; bottom: 20px; z-index: 90;
  width: 50px; height: 50px; border: 0; border-radius: 50%; cursor: pointer;
  background: var(--grad); color: #fff; font-size: 22px; font-weight: 700;
  box-shadow: 0 8px 22px rgba(47, 116, 207, 0.4);
  opacity: 0; visibility: hidden; transform: translateY(16px);
  transition: opacity .3s, transform .3s, visibility .3s;
}
.to-top.show { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { transform: translateY(-3px); }

a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--aqua-400); outline-offset: 3px; }

/* ── 반응형 ───────────────────────────────── */
@media (max-width: 1000px) {
  .quick-info, .stats { grid-template-columns: repeat(2, 1fr); }
  .quick-info li + li { border-left: 0; }
  .quick-info li:nth-child(even) { border-left: 1px dashed var(--line); }
  .quick-info li:nth-child(n+3) { border-top: 1px dashed var(--line); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .slider-track { --per-view: 2; }
  .cal-layout { grid-template-columns: 1fr; }
  .cal-detail { position: static; }
}

@media (max-width: 1180px) {
  .menu-toggle { display: flex; }
  .site-nav {
    position: absolute; top: var(--header-h); left: 0; right: 0;
    flex-direction: column; gap: 4px; padding: 12px 16px 20px;
    background: rgba(246, 250, 255, 0.98);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 12px 24px rgba(60, 120, 190, 0.15);
    opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity .25s, transform .25s, visibility .25s;
  }
  .site-nav.open { opacity: 1; visibility: visible; transform: none; }
  .site-nav a { padding: 14px 16px; font-size: 16px; border-radius: var(--radius-sm); }
}

@media (max-width: 860px) {
  .grid-2, .goals ol, .week-cols { grid-template-columns: 1fr; }
  .profile { flex-direction: column; text-align: center; padding: 32px 24px; }
  .tags { justify-content: center; }
  .contacts { justify-items: center; }
}

@media (max-width: 560px) {
  :root { --radius: 20px; --header-h: 62px; }
  .container { padding: 0 16px; }
  .section { padding: 64px 0; }
  .hero { padding: calc(var(--header-h) + 44px) 0 56px; }
  .badge { font-size: 12px; padding: 6px 14px; }
  .btn { padding: 0 16px; font-size: 15px; min-height: 50px; }
  .quick-info { grid-template-columns: 1fr; }
  .quick-info li:nth-child(even) { border-left: 0; }
  .quick-info li + li { border-top: 1px dashed var(--line); }
  .quick-info li { padding: 14px 12px; }
  .stats { gap: 12px; }
  .stat { padding: 20px 10px; }
  .stat-label { font-size: 13px; }
  .grid-3 { grid-template-columns: 1fr; }
  .slider-track { --per-view: 1; padding-right: 12%; }
  .card { padding: 22px; }
  .card.faq-item, .card.week-item { padding: 0; }
  .cal.card { padding: 16px 10px; }
  .brand-text small { display: none; }

  /* 주차 목록: 배지는 제목 아래로 */
  .week-item summary { grid-template-columns: auto 1fr auto; gap: 12px; padding: 14px; }
  .week-meta { grid-column: 2 / 4; grid-row: 2; justify-content: flex-start; margin-top: -6px; }
  .chevron { grid-column: 3; grid-row: 1; }
  .week-no { width: 48px; height: 48px; }
  .week-no b { font-size: 17px; }
  .week-body { padding: 4px 16px 18px; }
  .assign-foot .btn-submit { width: 100%; }

  /* 달력: 칸을 줄이고 주차 번호만 표시 */
  .cal-grid { gap: 3px; }
  .cal-day { min-height: 54px; padding: 5px 2px; align-items: center; border-radius: 10px; }
  .cal-day .num { font-size: 13px; }
  .cal-class span, .cal-due span { display: none; }
  .cal-class { font-size: 10px; }
  .cal-head h3 { font-size: 18px; }
  .avatar { width: 140px; height: 140px; font-size: 64px; }
  .faq-item summary { padding: 18px 52px 18px 18px; font-size: 15px; }
  .faq-item p { padding: 0 18px 20px 18px; }
  .to-top { right: 16px; bottom: 16px; width: 46px; height: 46px; }
}

/* ════════════════════════════════════════════
   4~5단계: 참여 기능 · 실시간 퀴즈 · 관리자 화면
   ════════════════════════════════════════════ */

/* ── 공통 도우미 ──────────────────────────── */
.center { text-align: center; }
.small { font-size: 13px; }
.m0 { margin: 0 !important; }
.no-scroll { overflow: hidden; }
.btn-sm { min-height: 40px; padding: 0 18px; font-size: 14px; flex: none; }
.btn-small.primary { background: var(--grad); color: #fff; border-color: transparent; }
.btn-small.danger { color: #c93a4f; border-color: #f3c6cd; }
.btn-small.danger:hover { background: #c93a4f; color: #fff; }
.btn-small:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer;
  font-size: 15px; line-height: 1; color: var(--text-soft); flex: none;
}
.icon-btn:hover { background: var(--sky-50); color: var(--text); }
.icon-btn.danger:hover { background: #c93a4f; color: #fff; border-color: transparent; }
.form-error { min-height: 1.2em; margin: 6px 0; font-size: 14px; font-weight: 500; color: #c93a4f; }
.form-submit { width: 100%; }
.demo-note { margin-top: 12px; font-size: 12px; color: var(--text-soft); }
.warn-note, .status-note {
  margin-top: 12px; padding: 10px 14px; border-radius: 12px; font-size: 13px;
  background: #fff6e0; color: #8a5a00; border: 1px solid #f5dfa6;
}
.status-note { background: var(--sky-50); color: var(--navy-700); border-color: var(--sky-200); margin: 0 0 14px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #c93a4f; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #e0435c; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.detail-empty h3 { margin-bottom: 4px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--sky-400); animation: bounce 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 50% { transform: translateY(-6px); opacity: .5; } }

/* 입력 요소 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .field legend { font-size: 14px; font-weight: 700; }
.field em { color: #c93a4f; font-style: normal; }
fieldset { border: 0; min-width: 0; }
input[type="text"], input[type="email"], input[type="tel"], input[type="password"], input[type="number"], input:not([type]),
select, textarea {
  width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff;
  font: inherit; font-size: 15px; color: var(--text); transition: border-color .2s, box-shadow .2s;
}
textarea { resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sky-400); box-shadow: 0 0 0 3px var(--sky-100); }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: #e0607e; background: #fff8f9; }
.field.invalid .check-group, .field.invalid .consent { outline: 2px solid #f3c6cd; outline-offset: 4px; border-radius: 12px; }
.field-error { font-size: 13px; color: #c93a4f; }
.field-error:empty { display: none; }
.char-count { align-self: flex-end; font-size: 12px; color: #c93a4f; }
.char-count.ok { color: var(--text-soft); }
.check-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.check-pill { position: relative; cursor: pointer; }
.check-pill input { position: absolute; opacity: 0; }
.check-pill span {
  display: inline-block; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: #fff; font-size: 14px; transition: background .2s, color .2s, border-color .2s;
}
.check-pill input:checked + span { background: var(--grad); color: #fff; border-color: transparent; }
.check-pill input:focus-visible + span { outline: 3px solid var(--aqua-400); outline-offset: 2px; }
.consent { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--sky-50); cursor: pointer; }
.consent input, .ed-bool input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--sky-500); flex: none; }
.consent span { display: flex; flex-direction: column; gap: 2px; }
.consent small { color: var(--text-soft); font-size: 13px; }

/* ── 수강 신청서 ──────────────────────────── */
.apply { margin-top: 24px; }
.apply > h3 { font-size: 22px; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 20px; margin: 20px 0; }
.error-summary {
  margin-top: 16px; padding: 16px 18px; border-radius: 14px;
  background: #fff4f6; border: 1px solid #f3c6cd; color: #8c2235;
}
.error-summary:focus { outline: 3px solid #f3c6cd; }
.error-summary ul { margin-top: 8px; display: grid; gap: 4px; }
.error-summary button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-size: 14px; color: inherit; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.apply-done { text-align: center; padding: 16px 0 4px; }
.done-icon { font-size: 52px; }
.apply-done h4 { font-size: 22px; margin: 6px 0; }
.done-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 520px; margin: 20px auto; text-align: left; }
.done-summary div { padding: 12px 14px; border-radius: 12px; background: var(--sky-50); }
.done-summary dt { font-size: 12px; color: var(--text-soft); }
.done-summary dd { font-weight: 700; }
.done-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.done-actions .btn { flex: 0 1 auto; }

/* ── 참여하기 (투표 · 수강생 공간) ────────── */
.participate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.poll-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.poll-head h3 { margin: 0; }
.poll-options { display: grid; gap: 10px; margin: 16px 0 12px; }
.poll-option {
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: #fff; cursor: pointer;
  font: inherit; text-align: left; color: var(--text); transition: border-color .2s, transform .15s;
}
.poll-option:hover { border-color: var(--sky-400); }
.poll-option:active { transform: scale(.99); }
.poll-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--sky-100), var(--aqua-100)); transition: width .6s ease; }
.poll-label, .poll-count { position: relative; }
.poll-label { font-weight: 500; font-size: 15px; }
.poll-count { flex: none; font-size: 13px; font-weight: 700; color: var(--navy-700); }
.poll-option.is-top .poll-fill { background: linear-gradient(90deg, var(--sky-200), var(--aqua-200)); }
.poll-option.is-mine { border-color: var(--sky-500); box-shadow: 0 0 0 2px var(--sky-100); }
.poll-option.is-mine .poll-label::before { content: "✔ "; color: var(--sky-500); }
.poll-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 13px; color: var(--text-soft); }

.login-form { display: grid; gap: 12px; margin-top: 16px; }
.dash-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.dash-head h3 { margin: 0; }
.tabs { display: flex; gap: 6px; padding: 5px; border-radius: 14px; background: var(--sky-50); margin-bottom: 18px; overflow-x: auto; }
.tabs button {
  flex: 1; min-height: 42px; padding: 0 14px; border: 0; border-radius: 10px; background: none; cursor: pointer; white-space: nowrap;
  font: inherit; font-size: 15px; font-weight: 700; color: var(--text-soft); transition: background .2s, color .2s;
}
.tabs button small { font-weight: 500; font-size: 11px; opacity: .8; }
.tabs button em { font-style: normal; font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--sky-100); margin-left: 4px; }
.tabs button[aria-selected="true"] { background: #fff; color: var(--navy-700); box-shadow: 0 2px 8px rgba(60, 120, 190, 0.15); }
.attend-now {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 18px; border-radius: 16px; background: linear-gradient(135deg, var(--sky-50), var(--aqua-100));
}
.attend-now > div { display: flex; flex-direction: column; }
.attend-now strong { font-size: 17px; }
.attend-now .btn { flex: none; }
.checkin-btn:disabled { background: #dfe7f0; color: #7d8ea3; box-shadow: none; cursor: default; transform: none; }
.attend-reason { margin: 10px 2px 16px; font-size: 14px; color: var(--text-soft); }
.attend-stat { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 14px; margin-bottom: 14px; }
.attend-stat b { color: var(--sky-500); font-size: 18px; }
.attend-stat .bar { flex-basis: 100%; }
.attend-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 10px; }
.att { display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); background: #fff; }
.att b { font-size: 13px; }
.att.ok { background: var(--grad); color: #fff; border-color: transparent; }
.att.miss { background: #edf2f7; color: #8695a8; }
.submit-form { display: grid; gap: 14px; }
.submit-due { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dropzone {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer;
  padding: 22px 16px; border-radius: 16px; border: 2px dashed var(--sky-200); background: var(--sky-50); transition: background .2s, border-color .2s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--sky-500); background: var(--sky-100); }
.dropzone.has-file { border-style: solid; border-color: var(--aqua-400); }
.dz-icon { font-size: 28px; }
.dz-text { font-size: 15px; }
.dropzone small { color: var(--text-soft); font-size: 12px; }
.dz-file { margin-top: 6px; font-weight: 700; color: var(--navy-700); word-break: break-all; }
.sub-title { font-size: 16px; margin: 22px 0 10px; }
.sub-list { display: grid; gap: 8px; }
.sub-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
.sub-list li > div { display: flex; flex-direction: column; min-width: 0; }
.sub-list .muted { font-size: 13px; word-break: break-all; }

/* ── 공지사항 ─────────────────────────────── */
.notice-section { padding: 28px 0 0; }
.notice-card { padding: 22px 24px; border-left: 5px solid var(--sky-400); }
.notice-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.notice-head h3 { margin: 0; }
.notice-list li + li { border-top: 1px dashed var(--line); }
.notice-list summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; }
.notice-list summary::-webkit-details-marker { display: none; }
.notice-list summary .muted { margin-left: auto; font-size: 13px; }
.notice-list p { padding: 0 0 12px; white-space: pre-line; color: var(--text); font-size: 15px; }
.notice-list li.important strong { color: #c93a4f; }

/* ── 팝업 · 대화상자 · 토스트 · 폭죽 ─────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; padding: 16px;
  background: rgba(16, 37, 70, 0.45); backdrop-filter: blur(3px);
  opacity: 0; transition: opacity .25s;
}
.modal-backdrop.show { opacity: 1; }
.modal {
  position: relative; width: min(460px, 100%); max-height: calc(100vh - 32px); overflow: auto;
  padding: 32px 28px 24px; border-radius: 24px; background: #fff; text-align: center;
  box-shadow: 0 24px 60px rgba(16, 37, 70, 0.3);
  transform: translateY(16px) scale(.97); transition: transform .25s;
}
.modal-backdrop.show .modal { transform: none; }
.modal h3 { font-size: 22px; margin: 14px 0 8px; }
.modal > p { color: var(--text-soft); }
.modal-close {
  position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;

  if (C.curriculum && S.firstClass) {
    const skip = new Set(S.skipDates || []);
    const cursor = parseDate(S.firstClass);
    C.curriculum.phases.forEach((p) => p.weeks.forEach((w) => {
      while (skip.has(ymd(cursor))) cursor.setDate(cursor.getDate() + 7);
      const date = w.date ? parseDate(w.date) : new Date(cursor);
      cursor.setDate(cursor.getDate() + 7);
      weeks.push({
        ...w, date, key: ymd(date),
        time: w.time || S.time, location: w.location || S.location,
        due: w.assignment ? parseDateTime(w.assignment.due) : null
      });
    }));
  }
  const currentWeek = weeks.find((w) => w.date >= today); // 오늘 또는 다음 수업

  // 날짜별로 수업과 과제 마감을 모아 둡니다(달력용).
  const byDate = {};
  weeks.forEach((w) => {
    (byDate[w.key] ||= { classes: [], dues: [] }).classes.push(w);
    if (w.due) (byDate[ymd(w.due)] ||= { classes: [], dues: [] }).dues.push(w);
  });

  // 마감까지 남은 시간 → [문구, 상태 클래스]
  function countdown(due) {
    const diff = due - Date.now();
    if (diff <= 0) return ["마감되었습니다", "closed"];
    const min = Math.floor(diff / 60000);
    const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
    const dueDay = new Date(due); dueDay.setHours(0, 0, 0, 0);
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const dday = Math.round((dueDay - now) / 86400000);
    const left = d > 0 ? `${d}일 ${h}시간 남음` : h > 0 ? `${h}시간 ${m}분 남음` : `${m}분 남음`;
    return [`${dday === 0 ? "D-Day" : "D-" + dday} · ${left}`, diff < 86400000 ? "urgent" : diff < 3 * 86400000 ? "soon" : ""];
  }
  const countdownChip = (w) => {
    const [t, cls] = countdown(w.due);
    return `<span class="countdown ${cls}" data-due="${w.due.getTime()}">⏳ ${t}</span>`;
  };

  const infoPills = (w, withDate = true) => `
    <div class="info-pills">
      ${withDate ? `<span>📅 <b>날짜</b> ${fmtDate(w.date)}</span>` : ""}
      <span>⏰ <b>시간</b> ${esc(w.time)}</span>
      <span>📍 <b>장소</b> ${esc(w.location)}</span>
    </div>`;

  const videoList = (w) => (w.videos || []).length
    ? `<ul class="video-list">${list(w.videos, (v) =>
        `<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></li>`)}</ul>`
    : `<p class="muted">이번 주는 참고 영상이 없습니다.</p>`;

  function assignmentBox(w, compact) {
    const a = w.assignment, url = a.submitUrl || S.submitUrl;
    const submit = url
      ? `<a class="btn btn-primary btn-submit" href="${esc(url)}" target="_blank" rel="noopener">과제 제출하기</a>`
      : `<button class="btn btn-primary btn-submit" data-submit-week="${esc(w.week)}">과제 제출하기</button>`;
    return `
      <div class="assign">
        <div class="assign-head">
          <h4>📌 ${compact ? "과제 마감 · " : "과제 · "}${esc(a.title)}</h4>
          ${countdownChip(w)}
        </div>
        ${compact ? "" : `<p>${esc(a.desc)}</p>`}
        <div class="assign-foot">
          <span class="due">마감 <b>${fmtDateTime(w.due)}</b></span>
          ${compact ? "" : submit}
        </div>
      </div>`;
  }

  function renderCurriculum(c) {
    const weekItem = (w) => {
      const past = w.date < today, now = w === currentWeek;
      return `
      <details class="card week-item${now ? " is-current" : ""}${past ? " is-past" : ""}" id="week-${esc(w.week)}"${now ? " open" : ""}>
        <summary>
          <span class="week-no"><b>${esc(w.week)}</b>주차</span>
          <span class="week-main"><strong>${esc(w.title)}</strong><p>${esc(w.desc)}</p></span>
          <span class="week-meta">
            <span class="chip chip-date">${fmtShort(w.date)}</span>
            ${now ? `<span class="chip chip-now">${w.key === ymd(today) ? "오늘 수업" : "다음 수업"}</span>` : ""}
            ${past ? `<span class="chip chip-done">완료</span>` : ""}
            ${w.assignment ? `<span class="chip chip-task">📌 과제</span>` : ""}
          </span>
          <span class="chevron" aria-hidden="true">▾</span>
        </summary>
        <div class="week-body">
          ${infoPills(w)}
          <div class="week-cols">
            <div><h4>학습 내용</h4><ul class="dot-list">${list(w.contents, (t) => `<li>${esc(t)}</li>`)}</ul></div>
            <div><h4>참고 영상</h4>${videoList(w)}</div>
          </div>
          ${w.assignment ? assignmentBox(w) : ""}
        </div>
      </details>`;
    };
    let i = 0;
    return `
    <section class="section section-tint" id="curriculum">
      <div class="container narrow">
        ${sectionHead(c.title, c.lead)}
        <div class="curri-toolbar">
          <div class="legend">
            <span><i style="background:var(--sky-400)"></i>다음 수업</span>
            <span>📌 과제 있음</span>
            <span><i style="background:#cdd8e4"></i>지난 수업</span>
          </div>
          <button class="btn-small" id="toggle-all">모두 펼치기</button>
        </div>
        ${list(c.phases, (p) => `
          <div class="phase-block">
            <h3 class="phase-name">${esc(p.name)}</h3>
            <div class="week-list">${list(p.weeks, () => weekItem(weeks[i++]))}</div>
          </div>`)}
      </div>
    </section>`;
  }

  function renderCalendar(c) {
    return `
    <section class="section" id="schedule">
      <div class="container">
        ${sectionHead(c.title, c.lead)}
        <div class="cal-layout">
          <div class="card cal">
            <div class="cal-head">
              <h3 id="cal-title" aria-live="polite"></h3>
              <div class="cal-nav">
                <button class="slider-btn" data-cal="-1" aria-label="이전 달">←</button>
                <button class="btn-small" data-cal="today">오늘</button>
                <button class="slider-btn" data-cal="1" aria-label="다음 달">→</button>
              </div>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
            <div class="legend cal-legend">
              <span><i style="background:linear-gradient(135deg,var(--sky-200),var(--aqua-200))"></i>수업일</span>
              <span>📌 과제 마감</span>
              <span><i style="background:var(--navy-700)"></i>오늘</span>
            </div>
          </div>
          <aside class="card cal-detail" id="cal-detail" aria-live="polite"></aside>
        </div>
      </div>
    </section>`;
  }

  function renderQuizSection(q) {
    return `
    <section class="section section-tint" id="quiz">
      <div class="container">
        ${sectionHead(q.title, q.lead)}
        <div class="tabs quiz-tabs" role="tablist">
          <button role="tab" data-quiz-tab="play" aria-selected="true">🙋 퀴즈 입장 <small>학생</small></button>
          <button role="tab" data-quiz-tab="host" aria-selected="false">🎮 퀴즈 진행 <small>교수자</small></button>
        </div>
        <div class="card quiz-card" id="quiz-panel" aria-live="polite"></div>

  }

  function renderTools(t) {
    return `
    <section class="section" id="tools">
      <div class="container">
        ${sectionHead(t.title, t.lead)}
        <div class="grid grid-3">
          ${list(t.items, (it) => `
            <article class="card tool hover-lift">
              <div class="tool-head">
                <div class="icon">${esc(it.icon)}</div>
                <div><h3>${esc(it.name)}</h3><span class="tool-tag">${esc(it.tag)}</span></div>
              </div>
              <p>${esc(it.text)}</p>
              ${it.url ? `<a class="tool-link" href="${esc(it.url)}" target="_blank" rel="noopener">바로가기 →</a>` : ""}
            </article>`)}

      </div>
