  function renderEnroll(e) {
    const g = e.grading;
    return `
    <section class="section section-tint" id="enroll">
      <div class="container">
        ${sectionHead(e.title, e.lead)}
        <div class="grid grid-2">
          ${e.prepare ? `
          <div class="card">
            <h3>${esc(e.prepare.title)}</h3>
            <ul class="prep-list">
              ${list(e.prepare.items, (p) => `
                <li>
                  <div class="icon">${esc(p.icon)}</div>
                  <div><strong>${esc(p.title)}</strong><p>${esc(p.text)}</p></div>
                </li>`)}
            </ul>
          </div>` : ""}
          ${g ? `
          <div class="card">
            <h3>${esc(g.title)}</h3>
            <ul class="bars">
              ${list(g.items, (it) => `
                <li>
                  <div class="bar-label"><span>${esc(it.label)}</span><b>${esc(it.percent)}%</b></div>
                  <div class="bar"><span style="width:${Number(it.percent) || 0}%"></span></div>
                </li>`)}
            </ul>
          </div>` : ""}
        </div>
        ${C.apply ? renderApply(C.apply) : ""}
      </div>
    </section>`;
  }

  /* ── 수강 신청서 ───────────────────────────── */
  function renderField(f) {
    const id = `f-${f.name}`;
    const req = f.required ? ` <em aria-hidden="true">*</em>` : "";
    const err = `<p class="field-error" id="${id}-err"></p>`;
    const attrs = `id="${id}" name="${esc(f.name)}"${f.required ? " required" : ""}${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ""}` +
      `${f.autocomplete ? ` autocomplete="${esc(f.autocomplete)}"` : ""}${f.inputmode ? ` inputmode="${esc(f.inputmode)}"` : ""} aria-describedby="${id}-err"`;
    const wrap = (inner) => `<div class="field${f.wide ? " wide" : ""}" data-field="${esc(f.name)}">${inner}${err}</div>`;
    switch (f.type) {
      case "select":
        return wrap(`<label for="${id}">${esc(f.label)}${req}</label>
          <select ${attrs}><option value="">선택하세요</option>${list(f.options, (o) => `<option>${esc(o)}</option>`)}</select>`);
      case "textarea":
        return wrap(`<label for="${id}">${esc(f.label)}${req}</label>
          <textarea ${attrs} rows="4"></textarea><span class="char-count" data-count-for="${esc(f.name)}"></span>`);
      case "checkbox":
        return wrap(`<fieldset aria-describedby="${id}-err"><legend>${esc(f.label)}${req}</legend>
          <div class="check-group">${list(f.options, (o, i) => `
            <label class="check-pill"><input type="checkbox" name="${esc(f.name)}" value="${esc(o)}" id="${i ? id + i : id}" /><span>${esc(o)}</span></label>`)}
          </div></fieldset>`);
      case "consent":
        return wrap(`<label class="consent"><input type="checkbox" ${attrs} />
          <span><b>${esc(f.label)}${req}</b><small>${esc(f.text)}</small></span></label>`);
      default:
        return wrap(`<label for="${id}">${esc(f.label)}${req}</label>
          <input type="${esc(f.type || "text")}" ${attrs} />`);
    }
  }

  function renderApply(a) {
    return `
        <div class="card apply" id="apply">
          <h3>📝 ${esc(a.title)}</h3>
          <p class="muted">${esc(a.lead)}</p>
          <div class="error-summary" role="alert" tabindex="-1" hidden></div>
          <form id="apply-form" novalidate>
            <div class="form-grid">${list(a.fields, renderField)}</div>
            <button type="submit" class="btn btn-primary form-submit">신청서 제출</button>
          </form>
          <div class="apply-done" hidden></div>
        </div>`;
  }

  /* ── 참여하기 (투표 · 수강생 공간) ─────────── */
  function renderParticipate(p) {
    const poll = C.poll;
    return `
    <section class="section" id="participate">
      <div class="container">
        ${sectionHead(p.title, p.lead)}
        <div class="participate-grid">
          ${poll ? `
          <div class="card poll" id="poll">
            <div class="poll-head">
              <h3>🗳️ ${esc(poll.title)}</h3>
              <span class="live"><i></i>실시간</span>
            </div>
            <p class="muted">${esc(poll.desc)}</p>
            <div class="poll-options" role="radiogroup" aria-label="${esc(poll.title)}">
              ${list(poll.options, (o) => `
                <button class="poll-option" data-vote="${esc(o.id)}" role="radio" aria-checked="false">
                  <span class="poll-fill" aria-hidden="true"></span>
                  <span class="poll-label">${esc(o.label)}</span>
                  <span class="poll-count"></span>
                </button>`)}
            </div>
            <p class="poll-foot"><span id="poll-total"></span><span id="poll-mine"></span></p>
          </div>` : ""}
          ${C.student ? `<div class="card student" id="student" aria-live="polite"></div>` : ""}
        </div>
      </div>
    </section>`;
  }

  function renderFaq(f) {
    return `
    <section class="section" id="faq">
      <div class="container narrow">
        ${sectionHead(f.title)}
        <div class="faq-list">
          ${list(f.items, (it) => `
            <details class="card faq-item">
              <summary>${esc(it.q)}</summary>
              <p>${esc(it.a)}</p>
            </details>`)}
        </div>
      </div>
    </section>`;
  }

  function renderFooter(p, f) {
    const photo = p.photo
      ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}" />`
      : `<span>${esc(p.photoEmoji)}</span>`;
    return `
      <div class="container">
        <h2 class="footer-title">${esc(p.title)}</h2>
        <div class="card profile">
          <div class="avatar">${photo}</div>
          <div class="profile-body">
            <h3>${esc(p.name)}</h3>
            <p class="position">${esc(p.position)}</p>
            <p>${esc(p.bio)}</p>
            <div class="tags">${list(p.fields, (t) => `<span class="tag">${esc(t)}</span>`)}</div>
            <ul class="contacts">
              ${list(p.contacts, (c) => {
                const v = c.href ? `<a href="${esc(c.href)}">${esc(c.value)}</a>` : esc(c.value);
                return `<li><span>${esc(c.icon)}</span><b>${esc(c.label)}</b>${v}</li>`;
              })}
            </ul>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <div class="container">
          <p>${esc(f.text)}</p>
          <small>${esc(f.copyright)}</small>
        </div>
      </div>`;
  }

  /* ── 페이지 조립 ───────────────────────────── */
  document.title = `${C.site.title} | ${C.site.university}`;

  document.querySelector(".brand").innerHTML = `
    <span class="brand-logo">${esc(C.site.logoEmoji)}</span>
    <span class="brand-text"><b>${esc(C.site.title)}</b><small>${esc(C.site.university)}</small></span>`;

  document.getElementById("site-nav").innerHTML = list(C.nav, (n) =>
    `<a href="#${esc(n.id)}" data-scroll="${esc(n.id)}">${esc(n.label)}</a>`);

  const toolCount = C.tools ? C.tools.items.length : 0;
  document.getElementById("app").innerHTML = [
    renderHero(C.hero, C.site),
    C.stats && renderStats(C.stats, toolCount),
    C.notices && `<section class="notice-section" id="notices" hidden></section>`,
    C.about && renderAbout(C.about),
    C.curriculum && renderCurriculum(C.curriculum),
    C.calendar && weeks.length && renderCalendar(C.calendar),
    C.tools && renderTools(C.tools),
    C.enroll && renderEnroll(C.enroll),
    C.participate && renderParticipate(C.participate),
    C.quiz && renderQuizSection(C.quiz),
    C.faq && renderFaq(C.faq)
  ].filter(Boolean).join("");

  document.getElementById("instructor").innerHTML = renderFooter(C.instructor, C.footer);

  /* ── 동작 ──────────────────────────────────── */
  const header = document.querySelector(".site-header");
  const nav = document.getElementById("site-nav");
  const toggle = document.querySelector(".menu-toggle");
  const toTop = document.querySelector(".to-top");

  function setMenu(open) {
    nav.classList.toggle("open", open);
    toggle.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", String(open));
    toggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
  }
  toggle.addEventListener("click", () => setMenu(!nav.classList.contains("open")));

  // 메뉴·버튼 클릭 시 고정 헤더 높이만큼 비켜서 부드럽게 이동
  document.addEventListener("click", (ev) => {
    const link = ev.target.closest("[data-scroll]");
    if (!link) return;
    ev.preventDefault();
    const id = link.dataset.scroll;
    const target = id === "top" ? null : document.getElementById(id);
    const y = target ? target.getBoundingClientRect().top + window.scrollY - header.offsetHeight + 1 : 0;
    window.scrollTo({ top: y, behavior: reduceMotion ? "auto" : "smooth" });
    history.replaceState(null, "", id === "top" ? location.pathname : `#${id}`);
    setMenu(false);
  });

  // 현재 보고 있는 섹션의 메뉴 강조
  const links = [...nav.querySelectorAll("a")];
  const sections = links.map((a) => document.getElementById(a.dataset.scroll)).filter(Boolean);

  function onScroll() {
    const y = window.scrollY;
    header.classList.toggle("scrolled", y > 10);
    toTop.classList.toggle("show", y > 500);

    const line = y + header.offsetHeight + 40;
    let current = "";
    for (const s of sections) if (s.offsetTop <= line) current = s.id;
    if (window.innerHeight + y >= document.documentElement.scrollHeight - 2 && sections.length)
      current = sections[sections.length - 1].id;
    links.forEach((a) => a.classList.toggle("active", a.dataset.scroll === current));
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }));

  // 통계 숫자: 화면에 보이면 0부터 올라가는 애니메이션
  const counters = document.querySelectorAll("[data-count]");
  if (!reduceMotion && "IntersectionObserver" in window) {
    counters.forEach((el) => (el.textContent = "0"));
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        io.unobserve(en.target);
        const el = en.target, to = Number(el.dataset.count), start = performance.now();
        const tick = (now) => {
          const p = Math.min((now - start) / 1200, 1);
          el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }, { threshold: 0.5 });
    counters.forEach((el) => io.observe(el));
  }

  // 장점 슬라이드: 버튼·점·키보드·손가락 스와이프(기본 가로 스크롤)로 넘기기
  document.querySelectorAll(".slider").forEach((root) => {
    const track = root.querySelector(".slider-track");
    const slides = [...track.children];
    const [prev, next] = root.querySelectorAll(".slider-btn");
    const dotsBox = root.querySelector(".slider-dots");
    if (!slides.length) return;

    const step = () => slides[0].offsetWidth + (parseFloat(getComputedStyle(track).columnGap) || 0);
    const pageCount = () => Math.max(1, slides.length - Math.round(track.clientWidth / step()) + 1);
    const goTo = (i) => track.scrollTo({ left: i * step(), behavior: reduceMotion ? "auto" : "smooth" });

    function buildDots() {
      dotsBox.innerHTML = Array.from({ length: pageCount() }, (_, i) =>
        `<button role="tab" aria-label="${i + 1}번째 보기"></button>`).join("");
      update();
    }
    function update() {
      const i = Math.round(track.scrollLeft / step());
      const max = track.scrollWidth - track.clientWidth;
      [...dotsBox.children].forEach((d, k) => {
        d.classList.toggle("active", k === i);
        d.setAttribute("aria-selected", String(k === i));
      });
      prev.disabled = track.scrollLeft <= 2;
      next.disabled = track.scrollLeft >= max - 2;
    }

    prev.addEventListener("click", () => track.scrollBy({ left: -step(), behavior: reduceMotion ? "auto" : "smooth" }));
    next.addEventListener("click", () => track.scrollBy({ left: step(), behavior: reduceMotion ? "auto" : "smooth" }));
    dotsBox.addEventListener("click", (ev) => {
      const i = [...dotsBox.children].indexOf(ev.target);
      if (i >= 0) goTo(i);
    });
    track.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") { ev.preventDefault(); next.click(); }
      if (ev.key === "ArrowLeft") { ev.preventDefault(); prev.click(); }
    });
    track.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", buildDots);
    buildDots();
  });

  // 과제 마감 카운트다운: 30초마다 갱신
  function updateCountdowns() {
    document.querySelectorAll("[data-due]").forEach((el) => {
      const [t, cls] = countdown(Number(el.dataset.due));
      el.textContent = `⏳ ${t}`;
      el.className = `countdown ${cls}`;
    });
  }
  setInterval(updateCountdowns, 30000);

  // 주차 펼치기: 모두 펼치기/접기, 특정 주차 열고 이동
  const weekItems = [...document.querySelectorAll(".week-item")];
  const toggleAll = document.getElementById("toggle-all");
  const syncToggleLabel = () => {
    if (toggleAll) toggleAll.textContent = weekItems.every((d) => d.open) ? "모두 접기" : "모두 펼치기";
  };
  if (toggleAll) {
    toggleAll.addEventListener("click", () => {
      const open = !weekItems.every((d) => d.open);
      weekItems.forEach((d) => (d.open = open));
      syncToggleLabel();
    });
    weekItems.forEach((d) => d.addEventListener("toggle", syncToggleLabel));
  }
  function openWeek(no) {
    const d = document.getElementById(`week-${no}`);
    if (!d) return;
    d.open = true;
    syncToggleLabel();
    const y = d.getBoundingClientRect().top + window.scrollY - header.offsetHeight - 16;
    window.scrollTo({ top: y, behavior: reduceMotion ? "auto" : "smooth" });
  }

  // 월간 달력
  const calGrid = document.getElementById("cal-grid");
  if (calGrid) {
    const calTitle = document.getElementById("cal-title");
    const calDetail = document.getElementById("cal-detail");
    const first = weeks[0].date, last = weeks[weeks.length - 1].date;
    // 학기 중이면 오늘, 아니면 가까운 학기 끝 날짜를 처음에 선택
    let selected = today < first ? first : today > last ? last : today;
    let view = new Date(selected.getFullYear(), selected.getMonth(), 1);

    function renderMonth() {
      const y = view.getFullYear(), m = view.getMonth();
      calTitle.textContent = `${y}년 ${m + 1}월`;
      const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
      const cells = Math.ceil((new Date(y, m, 1).getDay() + new Date(y, m + 1, 0).getDate()) / 7) * 7;
      let html = list(DOW, (d) => `<div class="cal-dow">${d}</div>`);
      for (let k = 0; k < cells; k++) {
        const d = new Date(start); d.setDate(start.getDate() + k);
        const key = ymd(d), e = byDate[key];
        const cls = ["cal-day",
          d.getMonth() !== m && "out", d.getDay() === 0 && "sun", d.getDay() === 6 && "sat",
          e && e.classes.length && "has-class", key === ymd(today) && "is-today", key === ymd(selected) && "is-selected"
        ].filter(Boolean).join(" ");
        const label = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일` +
          (e ? list(e.classes, (w) => `, ${w.week}주차 수업`) + list(e.dues, (w) => `, ${w.assignment.title} 마감`) : "");
        html += `
          <button class="${cls}" data-date="${key}" aria-label="${esc(label)}" aria-pressed="${key === ymd(selected)}">
            <span class="num">${d.getDate()}</span>
            ${e ? list(e.classes, (w) => `<span class="cal-class"><em>${esc(w.week)}주</em> <span>${esc(w.title)}</span></span>`) : ""}
            ${e ? list(e.dues, (w) => `<span class="cal-due">📌<span> ${esc(w.assignment.title)}</span></span>`) : ""}
          </button>`;
      }
      calGrid.innerHTML = html;
    }

    function renderDetail() {
      const key = ymd(selected), e = byDate[key];
      let body = "";
      if (e && e.classes.length) {
        body = list(e.classes, (w) => `
          <h3>${esc(w.week)}주차 · ${esc(w.title)}</h3>
          <p class="muted">${esc(w.desc)}</p>
          ${infoPills(w, false)}
          <h4 style="font-size:15px;margin-bottom:6px">학습 내용</h4>
          <ul class="dot-list">${list(w.contents, (t) => `<li>${esc(t)}</li>`)}</ul>
          ${(w.videos || []).length ? `<h4 style="font-size:15px;margin:14px 0 6px">참고 영상</h4>${videoList(w)}` : ""}
          ${w.assignment ? `<p class="muted" style="margin-top:12px">📌 이번 주 과제: ${esc(w.assignment.title)} (마감 ${fmtShort(w.due)})</p>` : ""}
          <button class="link-btn" data-open-week="${esc(w.week)}">커리큘럼에서 자세히 보기 →</button>`);
      } else {
        const next = weeks.find((w) => w.date > selected);
        body = `
          <div class="detail-empty">
            <div>🫧</div>
            <p>이 날은 수업이 없습니다.</p>
            ${next ? `<button class="link-btn" data-go-date="${next.key}">다음 수업: ${fmtShort(next.date)} ${esc(next.week)}주차 →</button>` : ""}
          </div>`;
      }
      if (e) body += list(e.dues, (w) => assignmentBox(w, true));
      calDetail.innerHTML = `<p class="detail-date">${fmtDate(selected)}${key === ymd(today) ? " · 오늘" : ""}</p>${body}`;
    }

    function select(date) {
      selected = date;
      view = new Date(date.getFullYear(), date.getMonth(), 1);
      renderMonth();
      renderDetail();
    }

    document.getElementById("schedule").addEventListener("click", (ev) => {
      const nav = ev.target.closest("[data-cal]");
      if (nav) {
        if (nav.dataset.cal === "today") return select(new Date(today));
        view = new Date(view.getFullYear(), view.getMonth() + Number(nav.dataset.cal), 1);
        return renderMonth();
      }
      const day = ev.target.closest("[data-date]");
      if (day) return select(parseDate(day.dataset.date));
      const go = ev.target.closest("[data-go-date]");
      if (go) return select(parseDate(go.dataset.goDate));
      const open = ev.target.closest("[data-open-week]");
      if (open) openWeek(open.dataset.openWeek);
    });

    renderMonth();
    renderDetail();
  }

  /* ── 저장소: 서버가 없으므로 이 브라우저(localStorage)에 저장합니다 ── */
  const PREFIX = "icmd:";
  const Store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(PREFIX + key); return v == null ? fallback : JSON.parse(v); }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* 저장 불가(사생활 보호 모드 등) */ }
    }
  };
  const session = () => Store.get("session", null);
  const fmtSize = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(b / 1024))}KB`);
  const scrollToEl = (el) => {
    const y = el.getBoundingClientRect().top + window.scrollY - header.offsetHeight - 16;
    window.scrollTo({ top: y, behavior: reduceMotion ? "auto" : "smooth" });
  };

  // 알림 메시지(토스트)
  function toast(msg) {
    let box = document.querySelector(".toast-box");
    if (!box) {
      box = document.createElement("div");
      box.className = "toast-box";
      box.setAttribute("role", "status");
      box.setAttribute("aria-live", "polite");
      document.body.appendChild(box);
    }
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.classList.add("hide"), 2600);
    setTimeout(() => t.remove(), 3000);
  }

  // 폭죽 효과: origin이 없으면 화면 양쪽 아래에서, 있으면 그 지점에서 터집니다.
  function confetti({ count = 160, origin = null } = {}) {
    if (reduceMotion) return;
    const cv = document.createElement("canvas");
    cv.className = "confetti";
    cv.setAttribute("aria-hidden", "true");
    document.body.appendChild(cv);
    const ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ["#4ea8ef", "#1f86dc", "#3cc2d7", "#173f7a", "#ffd166", "#bcdcfb"];
    const parts = Array.from({ length: count }, (_, i) => {
      const left = i % 2 === 0;
      const angle = origin ? Math.random() * Math.PI * 2 : (left ? -Math.PI / 3 : (-2 * Math.PI) / 3) + (Math.random() - 0.5) * 0.9;
      const speed = origin ? 3 + Math.random() * 7 : 9 + Math.random() * 10;
      return {
        x: origin ? origin.x : left ? 0 : innerWidth, y: origin ? origin.y : innerHeight * 0.8,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        size: 6 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
        color: colors[i % colors.length], shape: i % 3
      };
    });
    const DURATION = 3200, start = performance.now();
    (function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.globalAlpha = Math.max(0, 1 - t / DURATION);
      for (const p of parts) {
        p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.22;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        ctx.beginPath();
        if (p.shape === 0) ctx.rect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        else if (p.shape === 1) ctx.arc(0, 0, p.size / 2.6, 0, Math.PI * 2);
        else ctx.ellipse(0, 0, p.size / 2, p.size / 4, 0, 0, Math.PI * 2); // 꽃잎
        ctx.fill(); ctx.restore();
      }
      if (t < DURATION) requestAnimationFrame(frame); else cv.remove();
    })(start);
  }
  const burstFrom = (el) => {
    const r = el.getBoundingClientRect();
    confetti({ count: 70, origin: { x: r.left + r.width / 2, y: r.top + r.height / 2 } });
  };

  /* ── 실시간 투표 ───────────────────────────── */
  const pollEl = document.getElementById("poll");
  // 로그인했으면 학번, 아니면 브라우저마다 만든 임의 ID로 1인 1표를 구분합니다.
  function voterKey() {
    const s = session();
    if (s) return `s:${s.studentId}`;
    let id = Store.get("deviceId", null);
    if (!id) { id = Math.random().toString(36).slice(2, 10); Store.set("deviceId", id); }
    return `d:${id}`;
  }
  function renderPoll() {
    if (!pollEl) return;
    const voters = Store.get("poll", {});
    const counts = Object.fromEntries(C.poll.options.map((o) => [o.id, Number(o.seed) || 0]));
    Object.values(voters).forEach((id) => { if (id in counts) counts[id]++; });
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const max = Math.max(...Object.values(counts));
    const mine = voters[voterKey()];
    pollEl.querySelectorAll("[data-vote]").forEach((btn) => {
      const id = btn.dataset.vote, c = counts[id], pct = total ? Math.round((c / total) * 100) : 0;
      btn.querySelector(".poll-fill").style.width = `${pct}%`;
      btn.querySelector(".poll-count").textContent = `${pct}% · ${c}표`;
      btn.classList.toggle("is-mine", id === mine);
      btn.classList.toggle("is-top", c === max && c > 0);
      btn.setAttribute("aria-checked", String(id === mine));
    });
    document.getElementById("poll-total").textContent = `총 ${total}표`;
    const mineOpt = C.poll.options.find((o) => o.id === mine);
    document.getElementById("poll-mine").textContent = mineOpt ? `내 선택: ${mineOpt.label}` : "아직 투표하지 않았어요";
  }
  if (pollEl) {
    pollEl.addEventListener("click", (ev) => {
      const btn = ev.target.closest("[data-vote]");
      if (!btn) return;
      const voters = Store.get("poll", {}), key = voterKey(), had = voters[key];
      if (had === btn.dataset.vote) return toast("이미 이 주제에 투표했어요.");
      voters[key] = btn.dataset.vote;
      Store.set("poll", voters);
      renderPoll();
      toast(had ? "선택을 바꿨어요." : "투표해 주셔서 고마워요! 🗳️");
      if (!had) burstFrom(btn);
    });
    renderPoll();
  }

  /* ── 수강 신청서: 빠진 항목 검사 후 제출 ───── */
  const applyForm = document.getElementById("apply-form");
  if (applyForm) {
    const A = C.apply;
    const applyCard = document.getElementById("apply");
    const summary = applyCard.querySelector(".error-summary");
    const done = applyCard.querySelector(".apply-done");
    let tried = false;

    const valueOf = (f) => {
      if (f.type === "checkbox") return [...applyForm.querySelectorAll(`[name="${f.name}"]:checked`)].map((i) => i.value);
      if (f.type === "consent") return applyForm.elements[f.name].checked;
      return applyForm.elements[f.name].value.trim();
    };
    function check(f) {
      const v = valueOf(f);
      const empty = Array.isArray(v) ? !v.length : v === false || v === "";
      if (empty) {
        if (!f.required) return "";
        return f.type === "checkbox" ? "하나 이상 선택해 주세요." : f.type === "consent" ? "동의가 필요합니다."
          : f.type === "select" ? "항목을 선택해 주세요." : "필수 항목입니다.";
      }
      if (f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "이메일 형식(id@korea.ac.kr)으로 입력해 주세요.";
      if (f.pattern && !new RegExp(f.pattern).test(v)) return f.error || "형식이 올바르지 않습니다.";
      if (f.minLength && v.length < f.minLength) return `${f.minLength}자 이상 입력해 주세요. (현재 ${v.length}자)`;
      if (f.name === "studentId" && Store.get("applications", []).some((a) => a.studentId === v)) return "이미 신청한 학번입니다.";
      return "";
    }
    function showError(f, msg) {
      const box = applyForm.querySelector(`[data-field="${f.name}"]`);
      box.classList.toggle("invalid", !!msg);
      box.querySelector(".field-error").textContent = msg;
      box.querySelectorAll("input, select, textarea").forEach((el) => el.setAttribute("aria-invalid", String(!!msg)));
    }
    function updateCount() {
      applyForm.querySelectorAll("[data-count-for]").forEach((el) => {
        const f = A.fields.find((x) => x.name === el.dataset.countFor);
        const n = applyForm.elements[f.name].value.trim().length;
        el.textContent = f.minLength ? `${n} / ${f.minLength}자 이상` : `${n}자`;
        el.classList.toggle("ok", !f.minLength || n >= f.minLength);
      });
    }
    function refreshSummary(errors) {
      if (!errors.length) { summary.hidden = true; return; }
      summary.hidden = false;
      summary.innerHTML = `
        <strong>⚠️ 빠지거나 잘못된 항목이 ${errors.length}개 있어요.</strong>
        <ul>${list(errors, ([f, msg]) => `<li><button type="button" data-goto="${esc(f.name)}"><b>${esc(f.label)}</b> — ${esc(msg)}</button></li>`)}</ul>`;
    }
    const validateAll = () => A.fields.map((f) => [f, check(f)]).filter(([f, msg]) => (showError(f, msg), msg));

    applyForm.addEventListener("input", () => { updateCount(); if (tried) refreshSummary(validateAll()); });
    applyForm.addEventListener("change", () => { if (tried) refreshSummary(validateAll()); });
    summary.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-goto]");
      if (!b) return;
      const target = applyForm.querySelector(`[data-field="${b.dataset.goto}"] input, [data-field="${b.dataset.goto}"] select, [data-field="${b.dataset.goto}"] textarea`);
      scrollToEl(target.closest(".field"));
      target.focus({ preventScroll: true });
    });

    applyForm.addEventListener("submit", (ev) => {
      ev.preventDefault();
      tried = true;
      const errors = validateAll();
      refreshSummary(errors);
      if (errors.length) {
        scrollToEl(summary);
        summary.focus({ preventScroll: true });
        toast(`빠진 항목이 ${errors.length}개 있어요.`);
        return;
      }
      const data = Object.fromEntries(A.fields.map((f) => [f.name, valueOf(f)]));
      data.submittedAt = new Date().toISOString();
      Store.set("applications", [...Store.get("applications", []), data]);

      applyForm.hidden = true;
      summary.hidden = true;
      done.hidden = false;
      done.innerHTML = `
        <div class="done-icon">🎉</div>
        <h4>${esc(A.doneTitle)}</h4>
        <p class="muted">${esc(A.doneText)}</p>
        <dl class="done-summary">
          <div><dt>이름</dt><dd>${esc(data.name)}</dd></div>
          <div><dt>학번</dt><dd>${esc(data.studentId)}</dd></div>
          <div><dt>학과</dt><dd>${esc(data.department)}</dd></div>
          <div><dt>신청 일시</dt><dd>${fmtDateTime(new Date(data.submittedAt))}</dd></div>
        </dl>
        <div class="done-actions">
          <button type="button" class="btn btn-primary" data-go-login data-id="${esc(data.studentId)}" data-name="${esc(data.name)}">수강생 공간으로 가기</button>
          <button type="button" class="btn btn-ghost" data-new-apply>새 신청서 작성</button>
        </div>`;
      scrollToEl(applyCard);
      confetti();
    });

    done.addEventListener("click", (ev) => {
      if (ev.target.closest("[data-new-apply]")) {
        applyForm.reset(); tried = false; updateCount();
        A.fields.forEach((f) => showError(f, ""));
        done.hidden = true; applyForm.hidden = false;
      }
      const go = ev.target.closest("[data-go-login]");
      if (go && studentEl) {
        if (!session()) { studentTab = "attend"; renderStudent(); }
        const form = document.getElementById("login-form");
        if (form) { form.elements.studentId.value = go.dataset.id; form.elements.name.value = go.dataset.name; }
        scrollToEl(studentEl);
      }
    });
    updateCount();
  }

  /* ── 수강생 공간: 로그인 · 출석 · 과제 제출 ─ */
  const studentEl = document.getElementById("student");
  const ST = C.student || {};
  let studentTab = "attend", pendingWeek = null;
  const assignments = weeks.filter((w) => w.assignment);
  const minutesOf = (hhmm) => { const [h, m] = String(hhmm).split(":").map(Number); return (h || 0) * 60 + (m || 0); };

  // 지금 출석할 수 있는 수업과 그 이유를 계산합니다.
  function attendanceTarget() {
    const now = new Date();
    const todayWeek = weeks.find((w) => w.key === ymd(today));
    if (todayWeek) {
      const [s, e] = String(todayWeek.time).split("~").map((t) => minutesOf(t.trim()));
      const cur = now.getHours() * 60 + now.getMinutes(), from = s - (ST.checkinOpensBefore || 0);
      if (cur >= from && cur <= e) return { w: todayWeek, open: true, reason: "지금 출석할 수 있습니다." };
      if (!ST.demoMode) return { w: todayWeek, open: false,
        reason: cur < from ? `${pad(Math.floor(from / 60))}:${pad(from % 60)}부터 출석할 수 있습니다.` : "오늘 출석 시간이 지났습니다." };
    }
    if (ST.demoMode && currentWeek) return { w: currentWeek, open: true, reason: "데모 모드: 수업일이 아니어도 다음 수업 출석을 미리 해 볼 수 있어요." };
    return currentWeek
      ? { w: currentWeek, open: false, reason: `다음 수업일(${fmtShort(currentWeek.date)})에 출석할 수 있습니다.` }
      : { w: null, open: false, reason: "모든 수업이 끝났습니다." };
  }

  function loginView() {
    return `
      <h3>🔐 ${esc(ST.title)} 로그인</h3>
      <p class="muted">${esc(ST.loginHelp)}</p>
      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="login-id">학번</label>
          <input id="login-id" name="studentId" inputmode="numeric" placeholder="숫자 10자리" autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-name">이름</label>
          <input id="login-name" name="name" placeholder="홍길동" autocomplete="name" />
        </div>
        <p class="form-error" role="alert"></p>
        <button type="submit" class="btn btn-primary form-submit">로그인</button>
      </form>
      <p class="demo-note">${esc(ST.demoNote)}</p>`;
  }

  function attendView(s) {
    const rec = Store.get(`attendance:${s.studentId}`, {});
    const t = attendanceTarget(), w = t.w, done = w && rec[w.week];
    const held = weeks.filter((x) => x.date <= today || rec[x.week]);
    const attended = weeks.filter((x) => rec[x.week]).length;
    const rate = held.length ? Math.round((attended / held.length) * 100) : 0;
    return `
      <div class="attend-now">
        <div>
          <span class="muted">${w && w.key === ymd(today) ? "오늘의 수업" : "다음 수업"}</span>
          <strong>${w ? `${esc(w.week)}주차 · ${esc(w.title)}` : "예정된 수업이 없습니다"}</strong>
          ${w ? `<span class="muted">${fmtDate(w.date)} ${esc(w.time)}</span>` : ""}
        </div>
        <button class="btn btn-primary checkin-btn" data-checkin ${!w || !t.open || done ? "disabled" : ""}>
          ${done ? "출석 완료 ✓" : "출석하기"}
        </button>
      </div>
      <p class="attend-reason">${done ? `${fmtDateTime(new Date(done))}에 출석했습니다.` : esc(t.reason)}</p>
      <div class="attend-stat">
        <span>출석 <b>${attended}</b>회</span>
        <span>출석률 <b>${rate}%</b></span>
        <div class="bar"><span style="width:${rate}%"></span></div>
      </div>
      <ul class="attend-grid" aria-label="주차별 출석 현황">
        ${list(weeks, (x) => {
          const st = rec[x.week] ? "ok" : x.date < today ? "miss" : "future";
          const label = { ok: "출석", miss: "기록 없음", future: "예정" }[st];
          return `<li class="att ${st}" title="${esc(x.week)}주차 ${fmtShort(x.date)} · ${label}"><b>${esc(x.week)}</b><span>${{ ok: "✓", miss: "–", future: "·" }[st]}</span></li>`;
        })}
      </ul>
      <div class="legend"><span><i style="background:var(--sky-400)"></i>출석</span><span><i style="background:#cdd8e4"></i>기록 없음</span><span><i style="background:#fff;border:1px solid var(--line)"></i>예정</span></div>`;
  }

  function submitView(s) {
    const subs = Store.get(`submissions:${s.studentId}`, {});
    const ext = (ST.allowedExt || []).map((e) => "." + e).join(",");
    return `
      <form id="submit-form" class="submit-form" novalidate>
        <div class="field">
          <label for="submit-week">과제 선택</label>
          <select id="submit-week" name="week">
            <option value="">제출할 과제를 고르세요</option>
            ${list(assignments, (w) => `<option value="${esc(w.week)}"${String(pendingWeek) === String(w.week) ? " selected" : ""}>

  function renderStudent() {

  function setupSubmitForm(s) {
    const form = document.getElementById("submit-form");
    const input = document.getElementById("file-input");
    const zone = form.querySelector(".dropzone");
    const picked = zone.querySelector(".dz-file");
    const err = form.querySelector(".form-error");
    const dueBox = document.getElementById("submit-due");
    let file = null;

    const showDue = () => {
      const w = assignments.find((x) => String(x.week) === form.elements.week.value);
      dueBox.innerHTML = w ? `<span class="due">마감 <b>${fmtDateTime(w.due)}</b></span> ${countdownChip(w)}` : "";
    };
    const pick = (f) => {
      err.textContent = "";
      if (!f) return;
      const ext = f.name.split(".").pop().toLowerCase();
      if (ST.allowedExt && !ST.allowedExt.includes(ext)) { err.textContent = `.${ext} 파일은 올릴 수 없어요. (${ST.allowedExt.join(", ")})`; return; }
      if (f.size > (ST.maxFileMB || 10) * 1048576) { err.textContent = `파일이 너무 커요. ${ST.maxFileMB}MB 이하만 올릴 수 있어요. (현재 ${fmtSize(f.size)})`; return; }
      file = f;
      picked.hidden = false;
      picked.textContent = `✔ ${f.name} (${fmtSize(f.size)})`;
      zone.classList.add("has-file");
    };

    form.elements.week.addEventListener("change", () => { pendingWeek = form.elements.week.value; showDue(); });
    input.addEventListener("change", () => pick(input.files[0]));
    zone.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); input.click(); } });
    ["dragenter", "dragover"].forEach((t) => zone.addEventListener(t, (ev) => { ev.preventDefault(); zone.classList.add("drag"); }));
    ["dragleave", "drop"].forEach((t) => zone.addEventListener(t, (ev) => { ev.preventDefault(); zone.classList.remove("drag"); }));
    zone.addEventListener("drop", (ev) => pick(ev.dataTransfer.files[0]));

    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const w = assignments.find((x) => String(x.week) === form.elements.week.value);
      if (!w || !file) {
        err.textContent = !w && !file ? "과제와 파일을 선택해 주세요." : !w ? "과제를 선택해 주세요." : "파일을 선택해 주세요.";
        return;
      }
      const late = Date.now() > w.due.getTime();
      if (late && !confirm("마감 시간이 지났습니다. 지각 제출로 기록할까요?")) return;
      const subs = Store.get(`submissions:${s.studentId}`, {});
      const again = !!subs[w.week];
      subs[w.week] = { name: file.name, size: file.size, at: new Date().toISOString(), late, memo: form.elements.memo.value.trim() };
      Store.set(`submissions:${s.studentId}`, subs);
      pendingWeek = null;
      renderStudent();
      toast(`${w.week}주차 과제를 ${again ? "다시 " : ""}제출했어요.${late ? " (지각)" : ""}`);
      burstFrom(studentEl.querySelector(".sub-list") || studentEl);

    showDue();

  if (studentEl) {
    studentEl.addEventListener("submit", (ev) => {
      if (ev.target.id !== "login-form") return;
      ev.preventDefault();
      const f = ev.target, id = f.elements.studentId.value.trim(), name = f.elements.name.value.trim();
      const err = f.querySelector(".form-error");
      const missing = [!id && "학번", !name && "이름"].filter(Boolean);
      if (missing.length) { err.textContent = `${missing.join("과 ")}을 입력해 주세요.`; return; }
      if (!/^\d{10}$/.test(id)) { err.textContent = "학번은 숫자 10자리로 입력해 주세요."; return; }
      // 관리자가 수강생 명단을 등록했으면 명단에 있는 사람만 로그인할 수 있습니다.
      const roster = Store.get("roster", []);
      if (roster.length && !roster.some((r) => r.studentId === id && r.name === name)) {

      const applied = Store.get("applications", []).find((a) => a.studentId === id);
      if (!roster.length && applied && applied.name !== name) { err.textContent = "수강 신청서에 적은 이름과 일치하지 않습니다."; return; }
      Store.set("session", { studentId: id, name, at: new Date().toISOString() });
      Store.set("names", { ...Store.get("names", {}), [id]: name }); // 관리자 기록 화면에서 이름 표시용
      // 로그인 전에 한 투표는 로그인한 학번의 투표로 옮깁니다.
      const votes = Store.get("poll", {}), guest = `d:${Store.get("deviceId", "")}`;
      if (votes[guest] && !votes[`s:${id}`]) { votes[`s:${id}`] = votes[guest]; delete votes[guest]; Store.set("poll", votes); }
      renderStudent();
      renderPoll();
      toast(`${name}님, 로그인했어요.`);
    });
    studentEl.addEventListener("click", (ev) => {
      if (ev.target.closest("[data-logout]")) {
        Store.set("session", null);
        renderStudent(); renderPoll();

      }
      const tab = ev.target.closest("[data-tab]");
      if (tab) { studentTab = tab.dataset.tab; return renderStudent(); }
      const btn = ev.target.closest("[data-checkin]");
      if (btn) {
        const s = session(), t = attendanceTarget();
        if (!s || !t.open || !t.w) return;
        const rec = Store.get(`attendance:${s.studentId}`, {});
        rec[t.w.week] = new Date().toISOString();
        Store.set(`attendance:${s.studentId}`, rec);
        renderStudent();
        toast(`${t.w.week}주차 출석 완료! ✅`);
        burstFrom(studentEl.querySelector(".checkin-btn"));
      }
    });
    renderStudent();
  }

  // 커리큘럼의 '과제 제출하기' → 수강생 공간의 과제 제출 탭으로 이동
  document.addEventListener("click", (ev) => {

  // 다른 탭에서 투표·로그인하면 이 탭에도 바로 반영(같은 브라우저 안에서 실시간)

  /* ── 비밀번호 해시(SHA-256, 순수 JS) — 비밀번호를 코드에 그대로 두지 않기 위해 사용 ── */
  function sha256(str) {
    const bytes = new TextEncoder().encode(str);
    const K = [], H = [];
    const frac = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
    for (let n = 2, c = 0; c < 64; n++) {
      let prime = true;
      for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
      if (!prime) continue;
      if (c < 8) H[c] = frac(Math.pow(n, 1 / 2));
      K[c++] = frac(Math.pow(n, 1 / 3));
    }
    const len = bytes.length, words = [];
    for (let i = 0; i < len; i++) words[i >> 2] |= bytes[i] << ((3 - (i % 4)) * 8);
    words[len >> 2] |= 0x80 << ((3 - (len % 4)) * 8);
    const total = (((len + 8) >> 6) + 1) * 16;
    words[total - 1] = len * 8;
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let j = 0; j < total; j += 16) {
      const w = [];
      for (let i = 0; i < 16; i++) w[i] = words[j + i] | 0;
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        if (i >= 16) {
          const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
          const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
        }
        const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, c, d, e, f, g, h].forEach((v, k) => { H[k] = (H[k] + v) | 0; });
    }
    return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
  }

  /* ── 공통 대화상자 (Esc로 닫기, 포커스 가두기) ── */
  function makeDialog(className, html, label) {
    const back = document.createElement("div");
    back.className = "modal-backdrop";
    back.innerHTML = `<div class="modal ${className}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
    document.body.appendChild(back);
    document.body.classList.add("no-scroll");
    const last = document.activeElement;
    const onKey = (ev) => {
      if (ev.key === "Escape") close();
      if (ev.key === "Tab") {
        const f = [...back.querySelectorAll("button, a[href], input, select, textarea")].filter((x) => !x.disabled && x.offsetParent);
        if (!f.length) return;
        if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
        else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
      }
    };
    function close() {
      back.classList.remove("show");
      document.removeEventListener("keydown", onKey);
      document.body.classList.remove("no-scroll");
      setTimeout(() => back.remove(), 250);
      if (last && last.focus) last.focus({ preventScroll: true });
    }
    back.addEventListener("click", (ev) => { if (ev.target === back || ev.target.closest("[data-close]")) close(); });
    document.addEventListener("keydown", onKey);
    requestAnimationFrame(() => back.classList.add("show"));
    return { el: back.querySelector(".modal"), close };
  }

  /* ── 관리자 인증 ───────────────────────────── */
  const ADMIN_KEY = PREFIX + "admin";
  const lockBtn = document.querySelector(".lock-btn");
  const isAdmin = () => { try { return sessionStorage.getItem(ADMIN_KEY) === "1"; } catch (e) { return false; } };
  function setAdmin(on) {
    try { if (on) sessionStorage.setItem(ADMIN_KEY, "1"); else sessionStorage.removeItem(ADMIN_KEY); } catch (e) { /* 무시 */ }
    updateLock();
    renderQuiz();
  }
  function updateLock() {
    if (!lockBtn) return;
    lockBtn.textContent = isAdmin() ? "🔓" : "🔒";
    lockBtn.classList.toggle("on", isAdmin());
    lockBtn.setAttribute("aria-label", isAdmin() ? "관리자 화면 열기" : "관리자 로그인");
  }
  function askPassword(then) {
    const d = makeDialog("modal-sm", `
      <button class="modal-close" data-close aria-label="닫기">×</button>
      <div class="lock-icon">🔐</div>
      <h3>관리자 로그인</h3>
      <p class="muted">관리자 비밀번호를 입력하세요.</p>
      <form class="pw-form" novalidate>
        <input type="password" autocomplete="current-password" aria-label="비밀번호" placeholder="비밀번호" />
        <p class="form-error" role="alert"></p>
        <button type="submit" class="btn btn-primary form-submit">확인</button>
      </form>`, "관리자 로그인");
    const input = d.el.querySelector("input"), err = d.el.querySelector(".form-error");
    setTimeout(() => input.focus(), 50);
    d.el.querySelector("form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const A = C.admin || {};
      if (input.value && sha256((A.salt || "") + input.value) === A.passwordHash) {
        d.close();
        setAdmin(true);
        toast("관리자 모드로 전환했어요. 🔓");
        if (then) then();
      } else {
        err.textContent = input.value ? "비밀번호가 올바르지 않습니다." : "비밀번호를 입력해 주세요.";
        input.select();
        d.el.classList.remove("shake"); void d.el.offsetWidth; d.el.classList.add("shake");
      }
    });
  }
  if (lockBtn) lockBtn.addEventListener("click", () => (isAdmin() ? openAdmin() : askPassword(() => openAdmin())));
  updateLock();

  /* ── 공지사항 ──────────────────────────────── */
  const noticeEl = document.getElementById("notices");
  const sortedNotices = () => Store.get("notices", []).slice()
    .sort((a, b) => (b.important ? 1 : 0) - (a.important ? 1 : 0) || String(b.at).localeCompare(String(a.at)));
  function renderNotices() {
    if (!noticeEl) return;
    const items = sortedNotices();
    noticeEl.hidden = !items.length;
    noticeEl.innerHTML = items.length ? `
      <div class="container">
        <div class="card notice-card">
          <div class="notice-head"><h3>📢 ${esc(C.notices.title)}</h3><span class="muted">${items.length}건</span></div>
          <ul class="notice-list">
            ${list(items, (n, i) => `
              <li class="${n.important ? "important" : ""}">
                <details${i === 0 ? " open" : ""}>
                  <summary>
                    ${n.important ? `<span class="chip chip-task">중요</span>` : ""}
                    <strong>${esc(n.title)}</strong>
                    <span class="muted">${fmtShort(new Date(n.at))}</span>
                  </summary>
                  <p>${esc(n.body)}</p>
                </details>
              </li>`)}
          </ul>
        </div>
      </div>` : "";
  }
  renderNotices();

  /* ── 실시간 퀴즈 (카훗 방식: PIN·QR 입장 → 문제 → 정답 공개 → 순위 → 시상대) ── */
  const quizPanel = document.getElementById("quiz-panel");
  const QZ = C.quiz || {};
  const SHAPES = ["▲", "◆", "●", "■"];
  let quizTab = "play", quizSig = "", qrLoading = null;
  const urlPin = new URLSearchParams(location.search).get("pin") || "";
  const clone = (v) => JSON.parse(JSON.stringify(v ?? null));

  const getSets = () => {
    let sets = Store.get("quizSets", null);
    if (!sets) {
      sets = (QZ.sets || []).map((s, i) => ({ id: `set${i}`, title: s.title, questions: clone(s.questions) }));
      Store.set("quizSets", sets);
    }
    return sets;
  };
  const getGame = () => Store.get("game", null);
  const setGame = (g) => Store.set("game", g);
  const players = (pin) => Store.get(`game:${pin}:players`, {});
  const answers = (pin) => Store.get(`game:${pin}:answers`, {});
  const me = () => { try { return JSON.parse(sessionStorage.getItem(PREFIX + "player")); } catch (e) { return null; } };
  const setMe = (p) => { try { if (p) sessionStorage.setItem(PREFIX + "player", JSON.stringify(p)); else sessionStorage.removeItem(PREFIX + "player"); } catch (e) { /* 무시 */ } };
  const joinUrl = (pin) => `${QZ.joinBaseUrl || location.href.split(/[?#]/)[0]}?pin=${pin}#quiz`;
  const qLeft = (g) => {
    const q = g.questions[g.qi];
    return Math.max(0, Math.ceil(q.limit - (Date.now() - g.qStart) / 1000));
  };
  // 빨리 맞힐수록 높은 점수 (최대 1000점, 제한 시간 끝에 맞히면 500점)
  const scoreOf = (q, a) => (a && a.choice === q.answer ? Math.round(1000 * (1 - Math.min(a.ms, q.limit * 1000) / (q.limit * 1000) / 2)) : 0);

  // 참가자별 총점·정답 수·순위
  function standings(g, upto = g.qi) {
    const ps = players(g.pin), ans = answers(g.pin);
    return Object.entries(ps).map(([pid, p]) => {
      let total = 0, correct = 0, last = 0;
      for (let i = 0; i <= upto; i++) {
        const s = scoreOf(g.questions[i], (ans[i] || {})[pid]);
        total += s; if (s) correct++;
        if (i === upto) last = s;
      }
      return { pid, nick: p.nick, total, correct, last };
    }).sort((a, b) => b.total - a.total || a.nick.localeCompare(b.nick));
  }

  const tiles = (q, opts = {}) => `
    <div class="tile-grid${q.options.length === 2 ? " two" : ""}">
      ${list(q.options, (o, i) => `
        <${opts.clickable ? "button" : "div"} class="tile t${i}${opts.correct != null ? (i === opts.correct ? " is-correct" : " is-dim") : ""}${opts.picked === i ? " is-picked" : ""}"
          ${opts.clickable ? `data-answer="${i}"${opts.disabled ? " disabled" : ""}` : ""}>
          <span class="shape" aria-hidden="true">${SHAPES[i]}</span><span class="tile-text">${esc(o)}</span>
          ${opts.counts ? `<span class="tile-count">${opts.counts[i]}</span>` : ""}
        </${opts.clickable ? "button" : "div"}>`)}
    </div>`;

  const timerRing = (g) => {
    const q = g.questions[g.qi], left = qLeft(g);
    return `<div class="timer-ring${left <= 5 ? " hurry" : ""}" style="--p:${(left / q.limit) * 100}" data-qtimer><span>${left}</span></div>`;
  };

  function podium(rank) {
    const top = [rank[1], rank[0], rank[2]];
    return `<div class="podium">${list(top, (r, k) => r ? `
      <div class="pod pod-${[2, 1, 3][k]}"><div class="pod-name">${esc(r.nick)}</div><div class="pod-score">${r.total}점</div>
        <div class="pod-block"><span>${[2, 1, 3][k]}</span></div></div>` : `<div class="pod pod-empty"></div>`)}</div>`;
  }

  /* 학생 화면 */
  function playView() {
    const g = getGame(), p = me();
    const joined = g && p && p.pin === g.pin && players(g.pin)[p.pid];
    if (!joined) return `
      <form class="join-form" id="join-form" novalidate>
        <div class="join-logo">🎮</div>
        <h3>퀴즈 입장</h3>
        <p class="muted">교수자 화면의 <b>PIN</b>을 입력하거나 QR 코드를 찍어 들어오세요.</p>
        <input name="pin" class="pin-input" inputmode="numeric" maxlength="6" placeholder="게임 PIN" value="${esc(urlPin)}" aria-label="게임 PIN" />
        <input name="nick" maxlength="12" placeholder="닉네임 (12자 이내)" aria-label="닉네임" />
        <p class="form-error" role="alert"></p>
        <button class="btn btn-primary form-submit">입장하기</button>

      </form>`;
    const q = g.questions[g.qi], my = (answers(g.pin)[g.qi] || {})[p.pid];
    const head = `<div class="play-head"><span class="chip">${esc(p.nick)}</span><span class="muted">PIN ${esc(g.pin)}</span><button class="link-btn" data-leave>나가기</button></div>`;
    if (g.state === "lobby") return `${head}
      <div class="detail-empty"><div>🎉</div><h3>입장 완료!</h3><p>화면에 내 닉네임이 보이나요? 곧 퀴즈가 시작됩니다.</p>
      <p class="muted">현재 ${Object.keys(players(g.pin)).length}명 입장</p><div class="dots"><i></i><i></i><i></i></div></div>`;
    if (g.state === "question") return `${head}
      <div class="q-top"><span class="chip">문제 ${g.qi + 1} / ${g.questions.length}</span>${timerRing(g)}</div>
      <h3 class="quiz-q">${esc(q.question)}</h3>
      ${my ? `<div class="detail-empty"><div>✅</div><p>제출 완료! 다른 친구들을 기다리는 중…</p></div>`
           : tiles(q, { clickable: true })}`;
    const rank = standings(g), mine = rank.findIndex((r) => r.pid === p.pid), r = rank[mine];
    if (g.state === "final") return `${head}
      <h3 class="center">🏆 최종 결과</h3>${podium(rank)}
      <p class="center big-note">나는 <b>${mine + 1}위</b> · ${r.total}점 (정답 ${r.correct}/${g.questions.length})</p>`;
    const ok = my && my.choice === q.answer;
    return `${head}
      <div class="answer-result ${ok ? "ok" : "no"}">
        <div class="ar-icon">${ok ? "✅" : my ? "❌" : "⏰"}</div>
        <h3>${ok ? "정답!" : my ? "아쉬워요, 오답" : "시간 초과"}</h3>
        <p>${ok ? `+${r.last}점` : "+0점"} · 총 ${r.total}점 · 현재 <b>${mine + 1}위</b></p>
      </div>
      <p class="muted center">정답: ${SHAPES[q.answer]} ${esc(q.options[q.answer])}</p>`;
  }

          <button class="btn btn-primary form-submit" data-game-start>▶ 퀴즈 시작</button>
        </div>
      </div>`;
    if (g.state === "question") {

      return `${bar}
        <div class="q-top"><span class="chip">문제 ${g.qi + 1} / ${g.questions.length}</span>${timerRing(g)}
          <span class="answered">응답 <b data-qcount>${answered}</b> / ${n}</span></div>
        <h3 class="quiz-q host-q">${esc(q.question)}</h3>

    }
    if (g.state === "reveal") {
      const ans = Object.values(answers(g.pin)[g.qi] || {});
      const counts = q.options.map((_, i) => ans.filter((a) => a.choice === i).length);
      const rate = ans.length ? Math.round((counts[q.answer] / ans.length) * 100) : 0;
      return `${bar}
        <div class="q-top"><span class="chip">문제 ${g.qi + 1} / ${g.questions.length}</span><span class="answered">정답률 <b>${rate}%</b></span></div>
        <h3 class="quiz-q host-q">${esc(q.question)}</h3>
        ${tiles(q, { correct: q.answer, counts })}
        <div class="host-actions"><button class="btn btn-primary" data-game-leader>🏅 순위 보기</button></div>`;
    }
    const rank = standings(g), last = g.qi >= g.questions.length - 1;
    if (g.state === "leader") return `${bar}
      <h3 class="center">🏅 현재 순위</h3>
      <ol class="leaderboard">${list(rank.slice(0, 5), (r, i) => `<li><span class="lb-rank">${i + 1}</span><span class="lb-name">${esc(r.nick)}</span><span class="lb-delta">${r.last ? `+${r.last}` : ""}</span><span class="lb-score">${r.total}</span></li>`)}</ol>
      ${rank.length ? "" : `<p class="muted center">참가자가 없어요.</p>`}
      <div class="host-actions"><button class="btn btn-primary" data-game-next>${last ? "🏆 최종 결과" : "다음 문제 ▶"}</button></div>`;
    return `${bar}
      <h3 class="center">🏆 최종 결과</h3>${podium(rank)}
      ${table(["순위", "닉네임", "총점", "정답 수"], rank.map((r, i) => [i + 1, r.nick, r.total, `${r.correct} / ${g.questions.length}`]))}
      <div class="host-actions">
        <button class="btn btn-primary" data-game-csv>⬇ 결과 CSV 내려받기</button>
        <button class="btn btn-ghost" data-game-end>게임 닫기</button>
      </div>`;
  }

  function renderQuiz() {
    if (!quizPanel) return;
    document.querySelectorAll("[data-quiz-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.quizTab === quizTab)));
    const keep = quizPanel.querySelector("#ai-form") && quizTab === "host" && isAdmin() && !getGame();
    if (keep) return; // AI 입력 중에는 다시 그리지 않음
    quizPanel.innerHTML = quizTab === "play" ? playView() : hostView();
    quizSig = gameSig();
    const box = document.getElementById("qr-box");
    if (box) drawQR(box, joinUrl(getGame().pin));
  }
  // 상태가 바뀌었을 때만 화면 전체를 다시 그립니다.
  const gameSig = () => {
    const g = getGame(), p = me();
    if (!g) return `none:${quizTab}:${isAdmin()}:${JSON.stringify(getSets().map((s) => [s.id, s.title, s.questions.length]))}`;
    const ps = Object.keys(players(g.pin)).length;
    const mine = p ? JSON.stringify((answers(g.pin)[g.qi] || {})[p.pid] || null) : "";
    return `${quizTab}:${isAdmin()}:${g.pin}:${g.state}:${g.qi}:${g.state === "lobby" ? ps : ""}:${p && p.pin}:${mine}:${p && players(g.pin)[p.pid] ? 1 : 0}`;
  };

  // QR 코드 라이브러리는 로비 화면을 열 때만 불러옵니다.
  function drawQR(box, text) {
    const draw = () => {
      box.innerHTML = "";
      try { new window.QRCode(box, { text, width: 176, height: 176, colorDark: "#173f7a", colorLight: "#ffffff" }); }
      catch (e) { box.innerHTML = `<p class="muted small">QR을 만들지 못했어요.</p>`; }
    };
    if (window.QRCode) return draw();
    box.innerHTML = `<p class="muted small">QR 불러오는 중…</p>`;
    qrLoading = qrLoading || new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
      s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    });
    qrLoading.then(draw, () => { qrLoading = null; box.innerHTML = `<p class="muted small">인터넷 연결이 없어 QR을 표시하지 못했어요. 아래 주소나 PIN으로 입장하세요.</p>`; });
  }

  /* 게임 진행 */
  function openGame(set) {
    const pin = String(Math.floor(100000 + Math.random() * 900000));
    setGame({ pin, setId: set.id, title: set.title, questions: clone(set.questions), state: "lobby", qi: 0, qStart: 0, createdAt: Date.now() });
    Store.set(`game:${pin}:players`, {});
    Store.set(`game:${pin}:answers`, {});
  }
  function advance(state, extra = {}) { setGame({ ...getGame(), state, ...extra }); renderQuiz(); }
  function endGame() {
    const g = getGame();
    if (g) ["players", "answers"].forEach((k) => { try { localStorage.removeItem(`${PREFIX}game:${g.pin}:${k}`); } catch (e) { /* 무시 */ } });
    setGame(null);
  }
  function gameCSV() {
    const g = getGame(), ans = answers(g.pin), rank = standings(g, g.questions.length - 1);
    const head = ["순위", "닉네임", "총점", "정답 수"];
    g.questions.forEach((q, i) => head.push(`Q${i + 1} 선택`, `Q${i + 1} 정답여부`, `Q${i + 1} 응답시간(초)`, `Q${i + 1} 점수`));
    const rows = rank.map((r, k) => {
      const row = [k + 1, r.nick, r.total, r.correct];
      g.questions.forEach((q, i) => {
        const a = (ans[i] || {})[r.pid];
        row.push(a ? `${SHAPES[a.choice]} ${q.options[a.choice]}` : "미응답", a ? (a.choice === q.answer ? "O" : "X") : "", a ? (a.ms / 1000).toFixed(1) : "", scoreOf(q, a));
      });
      return row;
    });
    rows.push([], ["문항", "문제", "정답", "정답률"]);
    g.questions.forEach((q, i) => {
      const list_ = Object.values(ans[i] || {}), ok = list_.filter((a) => a.choice === q.answer).length;
      rows.push([`Q${i + 1}`, q.question, q.options[q.answer], list_.length ? `${Math.round((ok / list_.length) * 100)}%` : "-"]);
    });
    downloadCSV(`퀴즈결과_${g.title.replace(/[\\/:*?"<>|]/g, "")}`, { head, rows });
  }

  /* 퀴즈 편집기 */
  function editSet(set) {
    const draftSet = clone(set);
    const qRow = (q, i) => `
      <div class="qe-item" data-qi="${i}">
        <div class="ed-item-head"><b>문제 ${i + 1}</b><button type="button" class="icon-btn danger" data-qe-del aria-label="문제 삭제">×</button></div>
        <textarea class="qe-q" rows="2" placeholder="문제를 입력하세요">${esc(q.question)}</textarea>
        <div class="qe-opts">${[0, 1, 2, 3].map((k) => `
          <label class="qe-opt t${k}"><input type="radio" name="ans${i}" value="${k}"${q.answer === k ? " checked" : ""} aria-label="${k + 1}번을 정답으로" />
            <span class="shape">${SHAPES[k]}</span><input type="text" value="${esc(q.options[k] || "")}" placeholder="${k < 2 ? "보기 (필수)" : "보기 (선택)"}" /></label>`).join("")}
        </div>
        <label class="inline-field">제한 시간 <select class="qe-limit">${list([10, 20, 30, 60, 90, 120], (s) => `<option value="${s}"${q.limit === s ? " selected" : ""}>${s}초</option>`)}</select></label>
      </div>`;
    const d = makeDialog("modal-lg", `
      <button class="modal-close" data-close aria-label="닫기">×</button>
      <h3>✏️ 퀴즈 편집</h3>
      <label class="ed-field"><span>퀴즈 제목</span><input class="qe-title" value="${esc(draftSet.title)}" /></label>
      <div class="qe-list">${list(draftSet.questions, qRow)}</div>
      <button type="button" class="btn-small" data-qe-add>+ 문제 추가</button>
      <p class="muted small">동그라미를 눌러 정답을 고르세요. 보기는 2~4개까지 쓸 수 있어요.</p>
      <p class="form-error" role="alert"></p>
      <div class="host-actions"><button class="btn btn-ghost" data-close>취소</button><button class="btn btn-primary" data-qe-save>저장</button></div>`, "퀴즈 편집");
    const el = d.el, listEl = el.querySelector(".qe-list");
    const renumber = () => [...listEl.children].forEach((it, i) => {
      it.querySelector(".ed-item-head b").textContent = `문제 ${i + 1}`;
      it.querySelectorAll("[type=radio]").forEach((r) => { r.name = `ans${i}`; });
    });
    el.addEventListener("click", (ev) => {
      if (ev.target.closest("[data-qe-add]")) {
        listEl.insertAdjacentHTML("beforeend", qRow({ question: "", options: ["", "", "", ""], answer: 0, limit: 30 }, listEl.children.length));
        listEl.lastElementChild.querySelector("textarea").focus();
      }
      const del = ev.target.closest("[data-qe-del]");
      if (del) { del.closest(".qe-item").remove(); renumber(); }
      if (ev.target.closest("[data-qe-save]")) {
        const err = el.querySelector(".form-error"), problems = [];
        const questions = [...listEl.children].map((it, i) => {
          const raw = [...it.querySelectorAll(".qe-opt [type=text]")].map((x) => x.value.trim());
          const checked = Number((it.querySelector("[type=radio]:checked") || {}).value ?? -1);
          const options = raw.filter(Boolean), answer = raw[checked] ? options.indexOf(raw[checked]) : -1;
          const question = it.querySelector(".qe-q").value.trim();
          if (!question) problems.push(`문제 ${i + 1}: 문제 내용`);
          if (options.length < 2) problems.push(`문제 ${i + 1}: 보기 2개 이상`);
          if (answer < 0) problems.push(`문제 ${i + 1}: 정답 선택`);
          return { question, options, answer, limit: Number(it.querySelector(".qe-limit").value) };
        });
        if (!questions.length) problems.push("문제를 1개 이상 추가하세요");
        if (problems.length) { err.textContent = `확인해 주세요 — ${problems.slice(0, 4).join(", ")}${problems.length > 4 ? " …" : ""}`; return; }
        const sets = getSets(), i = sets.findIndex((s) => s.id === draftSet.id);
        const saved = { ...draftSet, title: el.querySelector(".qe-title").value.trim() || "제목 없는 퀴즈", questions };
        if (i >= 0) sets[i] = saved; else sets.push(saved);
        Store.set("quizSets", sets);
        d.close();
        toast("퀴즈를 저장했어요.");
        quizPanel.innerHTML = "";
        renderQuiz();
      }
    });
  }

  /* AI 문제 출제 */
  const QUIZ_SCHEMA = {
    type: "object",
    properties: {
      title: { type: "string" },
      questions: {
        type: "array",
        items: {
          type: "object",
          properties: {
            question: { type: "string" },
            options: { type: "array", items: { type: "string" } },
            answer: { type: "integer" }
          },
          required: ["question", "options", "answer"],
          additionalProperties: false
        }
      }
    },
    required: ["title", "questions"],
    additionalProperties: false
  };
  const aiPrompt = (topic, count, level) =>
    `당신은 사범대학 「${C.site.title}」 강의의 퀴즈 출제자입니다. 수강생은 예비·현직 정보 교사입니다.\n` +
    `주제 "${topic}"에 대해 난이도 '${level}'의 4지선다 문항 ${count}개를 한국어로 만드세요.\n` +
    `- 각 문항은 정답이 정확히 하나여야 하고, 오답 보기도 그럴듯해야 합니다.\n` +
    `- 문제는 80자, 보기는 30자 이내로 짧게 씁니다.\n` +
    `- answer는 정답 보기의 번호(0부터 3)입니다.\n` +
    `다음 JSON 형식으로만 답하세요: {"title": "퀴즈 제목", "questions": [{"question": "...", "options": ["...","...","...","..."], "answer": 0}]}`;

  // AI가 준 JSON을 검사해 퀴즈로 바꿉니다(코드 블록·앞뒤 설명이 섞여 있어도 처리).
  function quizFromAI(text, limit, topic) {
    const s = String(text).replace(/```(?:json)?/g, "");
    const start = s.search(/[[{]/), end = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
    if (start < 0 || end < start) throw new Error("JSON을 찾지 못했어요.");
    let data = JSON.parse(s.slice(start, end + 1));
    if (Array.isArray(data)) data = { title: topic, questions: data };
    const questions = (data.questions || []).map((q) => ({
      question: String(q.question || "").trim(),
      options: (q.options || []).map((o) => String(o).trim()).filter(Boolean).slice(0, 4),
      answer: Number(q.answer), limit
    })).filter((q) => q.question && q.options.length >= 2 && q.answer >= 0 && q.answer < q.options.length);
    if (!questions.length) throw new Error("쓸 수 있는 문항이 없어요.");
    return { id: `set${Date.now().toString(36)}`, title: `🤖 ${String(data.title || topic).slice(0, 40)}`, questions };
  }

  // 교수자의 API 키로 브라우저에서 바로 Claude를 호출합니다(서버 없음).
  async function generateWithClaude(key, prompt) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "anthropic-beta": "server-side-fallback-2026-07-01"
      },
      body: JSON.stringify({
        model: (QZ.ai && QZ.ai.model) || "claude-opus-5-5",
        max_tokens: 16000,
        output_config: { effort: "medium", format: { type: "json_schema", schema: QUIZ_SCHEMA } },
        fallbacks: "default",
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = (data.error && data.error.message) || `HTTP ${res.status}`;
      throw new Error(res.status === 401 ? "API 키가 올바르지 않아요." : res.status === 429 ? "요청이 많아요. 잠시 뒤 다시 시도하세요." : msg);
    }
    if (data.stop_reason === "refusal") throw new Error("AI가 이 요청에 답하지 않았어요. 주제를 바꿔 보세요.");
    if (data.stop_reason === "max_tokens") throw new Error("답변이 너무 길어 잘렸어요. 문항 수를 줄여 보세요.");
    return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  }

  const CSV_SOURCES = { attend: ["출석부", attendData], submit: ["과제제출", submitData], apply: ["수강신청", applyData], roster: ["수강생명단", rosterData] };

      ${table(["학번", "이름", "학과", ""], roster.map((r) => [r.studentId, r.name, r.department || "",
        { html: `<button class="icon-btn danger" data-roster-del="${esc(r.studentId)}" aria-label="${esc(r.name)} 삭제">×</button>` }]))}`;

  function noticeTab() {

          <span class="muted small">${fmtDateTime(new Date(n.at))}</span><p class="muted">${esc(n.body)}</p></div>
          <button class="icon-btn danger" data-notice-del="${esc(n.id)}" aria-label="공지 삭제">×</button></li>`)}</ul>`

  function recordsTab() {
    const data = { attend: attendData(), submit: submitData(), apply: applyData() };
    const names = { attend: "출석부", submit: "과제 제출", apply: "수강 신청" };
    const d = data[recordTab];

        <b>${names[recordTab]} 내역</b>

      <p class="muted small">CSV 파일은 엑셀에서 바로 열 수 있습니다. 기록은 이 브라우저에 저장된 내용입니다.</p>`;

    return `
      ${overridden ? `<p class="status-note">✏️ 이 브라우저에는 관리자 화면에서 고친 설정이 적용되어 있어요.</p>` : ""}
      <div class="admin-grid2">
        <div class="lite-card">
          <h4>💾 설정 내려받기</h4>
          <p class="muted small">현재 사이트 설정 전체를 파일로 저장합니다.</p>
          <div class="row-actions">
            <button class="btn btn-primary btn-sm" data-export="json">JSON 파일</button>
            <button class="btn-small" data-export="js">index.html 설정 블록</button>
          </div>
        </div>
        <div class="lite-card">
          <h4>📂 설정 불러오기</h4>
          <p class="muted small">내려받아 둔 설정 파일(.json / .js)을 불러와 적용합니다.</p>
          <label class="btn btn-ghost btn-sm file-btn">파일 선택<input type="file" accept=".json,.js,application/json" data-import-config hidden /></label>
          <p class="form-error" data-import-err role="alert"></p>
        </div>
        <form class="lite-card" data-form="password" novalidate>
          <h4>🔑 비밀번호 변경</h4>
          <input type="password" name="pw1" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password" aria-label="새 비밀번호" />
          <input type="password" name="pw2" placeholder="새 비밀번호 확인" autocomplete="new-password" aria-label="새 비밀번호 확인" />
          <p class="form-error" role="alert"></p>
          <button class="btn btn-primary btn-sm">변경</button>
        </form>
        <div class="lite-card">
          <h4>🗂️ 데이터 백업</h4>
          <p class="muted small">투표·신청서·출석·과제·공지·퀴즈 기록을 한 파일로 저장하거나 복원합니다.</p>
          <div class="row-actions">
            <button class="btn-small" data-backup>백업 저장</button>
            <label class="btn-small file-btn">복원<input type="file" accept=".json" data-restore hidden /></label>
          </div>
