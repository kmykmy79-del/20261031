      </div>
      <div class="lite-card danger-zone">
        <h4>↩️ 기본 설정으로 되돌리기</h4>
        <p class="muted small">관리자 화면에서 고친 설정을 지우고 index.html에 적힌 원래 설정으로 돌아갑니다. (기록 데이터는 그대로 남습니다)</p>
        <button class="btn-small danger" data-reset-config${overridden ? "" : " disabled"}>되돌리기</button>
      </div>`;
  }

  function renderAdmin(keepScroll) {
    if (!adminDlg) return;
    const panel = adminDlg.el.querySelector("#admin-panel"), y = panel.scrollTop;
    adminDlg.el.querySelectorAll("[data-admin-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.adminTab === adminTab)));
    panel.innerHTML = { edit: editTab, roster: rosterTab, notice: noticeTab, records: recordsTab, config: configTab }[adminTab]();
    panel.scrollTop = keepScroll ? y : 0;
  }

  function openAdmin(tab) {
    if (!isAdmin()) return askPassword(() => openAdmin(tab));
    if (tab) adminTab = tab;
    draft = null;
    adminDlg = makeDialog("admin-modal", `
      <div class="admin-head">
        <h3>🛠️ 관리자 화면</h3>
        <div><button class="btn-small" data-admin-logout>🔒 잠그기</button><button class="modal-close" data-close aria-label="닫기">×</button></div>
      </div>
      <div class="admin-body">
        <nav class="admin-tabs" role="tablist" aria-label="관리 메뉴">${list(ADMIN_TABS, ([k, l]) => `<button role="tab" data-admin-tab="${k}">${l}</button>`)}</nav>
        <div class="admin-panel" id="admin-panel" role="tabpanel"></div>
      </div>`, "관리자 화면");
    const el = adminDlg.el;
    el.addEventListener("click", onAdminClick);
    el.addEventListener("input", onAdminInput);
    el.addEventListener("change", onAdminChange);
    el.addEventListener("submit", onAdminSubmit);
    renderAdmin();
  }

  function onAdminInput(ev) {
    const t = ev.target;
    if (!t.dataset.ed) return;
    const path = JSON.parse(t.dataset.ed);
    const val = t.dataset.type === "boolean" ? t.checked : t.dataset.type === "number" ? Number(t.value) : t.value;
    if (!path.length) draft = val;
    else getAt(draft, path.slice(0, -1))[path[path.length - 1]] = val;
  }

  function readJsonDraft() {
    const ta = adminDlg.el.querySelector("[data-json]");
    if (!ta) return true;
    try { draft = JSON.parse(ta.value); return true; }
    catch (e) { adminDlg.el.querySelector("[data-json-err]").textContent = `JSON 형식 오류: ${e.message}`; return false; }
  }

  function readFile(file, cb) {
    const r = new FileReader();
    r.onload = () => cb(String(r.result));
    r.readAsText(file, "utf-8");
  }

  function onAdminChange(ev) {
    const t = ev.target;
    if (t.matches("[data-edit-key]")) { editKey = t.value; draft = clone(C[editKey]); return renderAdmin(); }
    if (t.matches("[data-json-mode]")) {
      if (!t.checked && !readJsonDraft()) { t.checked = true; return; }
      jsonMode = t.checked;
      return renderAdmin();
    }
    if (t.matches("[data-import-config]") && t.files[0]) {
      readFile(t.files[0], (text) => {
        try {
          const json = JSON.parse(text.replace(/^[\s\S]*?window\.SITE_CONFIG\s*=\s*/, "").replace(/;\s*$/, ""));
          if (!json || typeof json !== "object" || !json.site) throw new Error("사이트 설정 파일이 아닙니다.");
          saveOverride(json, { tab: "config" });
        } catch (e) { adminDlg.el.querySelector("[data-import-err]").textContent = `불러오지 못했어요: ${e.message}`; }
      });
    }
    if (t.matches("[data-restore]") && t.files[0]) {
      readFile(t.files[0], (text) => {
        try {
          const data = JSON.parse(text);
          if (!data || data.app !== "icmd-backup") throw new Error("백업 파일이 아닙니다.");
          if (!confirm("현재 기록을 백업 파일의 내용으로 덮어씁니다. 계속할까요?")) return;
          Object.entries(data.items).forEach(([k, v]) => localStorage.setItem(PREFIX + k, v));
          toast("백업을 복원했어요.");
          saveOverride(Store.get("configOverride", null) || C, { tab: "config" });
        } catch (e) { toast(`복원하지 못했어요: ${e.message}`); }
      });
    }
  }

  function onAdminClick(ev) {
    const t = (sel) => ev.target.closest(sel);
    let el;
    if (t("[data-admin-logout]")) { adminDlg.close(); setAdmin(false); return toast("관리자 모드를 잠갔어요. 🔒"); }
    if ((el = t("[data-admin-tab]"))) { adminTab = el.dataset.adminTab; draft = null; return renderAdmin(); }
    if ((el = t("[data-record-tab]"))) { recordTab = el.dataset.recordTab; return renderAdmin(); }
    if ((el = t("[data-csv]"))) { const [title, fn] = CSV_SOURCES[el.dataset.csv]; return downloadCSV(title, fn()); }

    // 사이트 편집
    if ((el = t("[data-ed-add]"))) {
      const arr = getAt(draft, JSON.parse(el.dataset.edAdd));
      arr.push(arr.length ? blank(clone(arr[arr.length - 1])) : "");
      return renderAdmin(true);
    }
    if ((el = t("[data-ed-del]"))) {
      const path = JSON.parse(el.dataset.edDel), arr = getAt(draft, path.slice(0, -1));
      if (!confirm("이 항목을 삭제할까요?")) return;
      arr.splice(path[path.length - 1], 1);
      return renderAdmin(true);
    }
    if ((el = t("[data-ed-move]"))) {
      const path = JSON.parse(el.dataset.path), arr = getAt(draft, path.slice(0, -1));
      const i = path[path.length - 1], j = i + Number(el.dataset.edMove);
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return renderAdmin(true);
    }
    if (t("[data-edit-cancel]")) { draft = clone(C[editKey]); return renderAdmin(); }
    if (t("[data-edit-save]")) {
      if (jsonMode && !readJsonDraft()) return;
      return saveOverride({ ...C, [editKey]: draft });
    }

    // 수강생 명단
    if ((el = t("[data-roster-del]"))) {
      Store.set("roster", Store.get("roster", []).filter((r) => r.studentId !== el.dataset.rosterDel));
      return renderAdmin(true);
    }
    if (t("[data-roster-clear]")) {
      if (!confirm("등록된 수강생 명단을 모두 지울까요?")) return;
      Store.set("roster", []);
      return renderAdmin();
    }
    if (t("[data-roster-import]")) {
      const roster = Store.get("roster", []), have = new Set(roster.map((r) => r.studentId));
      const add = Store.get("applications", []).filter((a) => !have.has(a.studentId))
        .map((a) => ({ studentId: a.studentId, name: a.name, department: a.department || "" }));
      Store.set("roster", [...roster, ...add]);
      toast(add.length ? `신청자 ${add.length}명을 명단에 추가했어요.` : "새로 추가할 신청자가 없어요.");
      return renderAdmin();
    }

    // 공지
    if ((el = t("[data-notice-del]"))) {
      if (!confirm("이 공지를 삭제할까요?")) return;
      Store.set("notices", Store.get("notices", []).filter((n) => n.id !== el.dataset.noticeDel));
      renderNotices();
      return renderAdmin(true);
    }

    // 설정 파일
    if ((el = t("[data-export]"))) {
      const json = JSON.stringify(C, null, 2);
      if (el.dataset.export === "json") downloadFile("site-config.json", json, "application/json");
      else downloadFile("site-config-block.js",
        `/* index.html 안의 "window.SITE_CONFIG = { ... };" 부분을 아래 내용으로 바꾸세요. */\nwindow.SITE_CONFIG = ${json};\n`, "text/javascript");
      return toast("설정 파일을 내려받았어요.");
    }
    if (t("[data-backup]")) {
      const items = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k.startsWith(PREFIX) && k !== PREFIX + "session") items[k.slice(PREFIX.length)] = localStorage.getItem(k);
        }
      } catch (e) { /* 무시 */ }
      downloadFile(`사이트데이터백업_${ymd(new Date())}.json`, JSON.stringify({ app: "icmd-backup", at: new Date().toISOString(), items }, null, 2), "application/json");
      return toast("데이터 백업 파일을 내려받았어요.");
    }
    if (t("[data-reset-config]")) {
      if (!confirm("관리자 화면에서 고친 설정을 지우고 원래 설정으로 되돌릴까요?")) return;
      try { localStorage.removeItem(PREFIX + "configOverride"); } catch (e) { /* 무시 */ }
      try { sessionStorage.setItem(PREFIX + "reopen", JSON.stringify({ tab: "config" })); } catch (e) { /* 무시 */ }
      return location.reload();
    }
  }

  function onAdminSubmit(ev) {
    const form = ev.target, kind = form.dataset.form;
    if (!kind) return;
    ev.preventDefault();
    const err = form.querySelector(".form-error");
    const v = (n) => (form.elements[n] ? form.elements[n].value.trim() : "");
    if (kind === "roster-add") {
      const id = v("studentId"), name = v("name");
      if (!id || !name) return (err.textContent = "학번과 이름을 입력해 주세요.");
      if (!/^\d{10}$/.test(id)) return (err.textContent = "학번은 숫자 10자리입니다.");
      const roster = Store.get("roster", []);
      if (roster.some((r) => r.studentId === id)) return (err.textContent = "이미 등록된 학번입니다.");
      Store.set("roster", [...roster, { studentId: id, name, department: v("department") }]);
      toast(`${name} 학생을 등록했어요.`);
      return renderAdmin(true);
    }
    if (kind === "roster-bulk") {
      const roster = Store.get("roster", []), have = new Set(roster.map((r) => r.studentId));
      let added = 0, skipped = 0;
      v("bulk").split(/\r?\n/).filter((l) => l.trim()).forEach((line) => {
        const [id = "", name = "", dept = ""] = line.split(/[,\t]/).map((s) => s.trim());
        if (!/^\d{10}$/.test(id) || !name || have.has(id)) { skipped++; return; }
        roster.push({ studentId: id, name, department: dept }); have.add(id); added++;
      });
      if (!added && !skipped) return (err.textContent = "한 줄에 한 명씩 '학번,이름,학과' 형식으로 입력해 주세요.");
      Store.set("roster", roster);
      toast(`${added}명 등록${skipped ? `, ${skipped}줄은 형식 오류나 중복으로 건너뛰었어요` : ""}.`);
      return renderAdmin();
    }
    if (kind === "notice") {
      const title = v("title"), body = v("body");
      if (!title || !body) return (err.textContent = title ? "내용을 입력해 주세요." : "제목을 입력해 주세요.");
      Store.set("notices", [...Store.get("notices", []),
        { id: `n${Date.now().toString(36)}`, title, body, important: form.elements.important.checked, at: new Date().toISOString() }]);
      renderNotices();
      toast("공지를 올렸어요. 첫 화면 아래에 표시됩니다.");
      return renderAdmin();
    }
    if (kind === "password") {
      const p1 = form.elements.pw1.value, p2 = form.elements.pw2.value;
      if (p1.length < 6) return (err.textContent = "6자 이상 입력해 주세요.");
      if (p1 !== p2) return (err.textContent = "두 비밀번호가 서로 다릅니다.");
      const salt = (C.admin && C.admin.salt) || "icmd-salt:";
      C = { ...C, admin: { salt, passwordHash: sha256(salt + p1) } };
      Store.set("configOverride", C);
      form.reset();
      err.textContent = "";
      toast("비밀번호를 바꿨어요. 다른 기기에도 쓰려면 설정 파일을 내려받아 index.html에 반영하세요.");
    }
  }

  // 설정 저장 후 새로고침했다면 관리자 화면을 다시 엽니다.
  try {
    const reopen = JSON.parse(sessionStorage.getItem(PREFIX + "reopen"));
    sessionStorage.removeItem(PREFIX + "reopen");
    if (reopen && isAdmin()) {
      if (reopen.key) editKey = reopen.key;
      openAdmin(reopen.tab);
      toast("저장한 설정을 적용했어요.");
    }
  } catch (e) { /* 무시 */ }

  /* ── 수강 신청 안내 팝업 ('오늘 하루 보지 않기') ── */
  const P = C.popup;
  if (P && P.enabled && !isAdmin() && Store.get("popupHideUntil", 0) < Date.now()) {
    const modal = document.createElement("div");
    modal.className = "modal-backdrop";
    modal.hidden = true;
    modal.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="popup-title">
        <button class="modal-close" data-close aria-label="닫기">×</button>
        <span class="badge">${esc(P.badge)}</span>
        <h3 id="popup-title">${esc(P.title)}</h3>
        <p>${esc(P.text)}</p>
        <ul class="modal-list">${list(P.items, (i) => `<li><span>${esc(i.icon)}</span><b>${esc(i.label)}</b>${esc(i.value)}</li>`)}</ul>
        <a class="btn btn-primary" href="#${esc(P.button.target)}" data-scroll="${esc(P.button.target)}" data-close>${esc(P.button.label)}</a>
        <div class="modal-foot">
          <label><input type="checkbox" id="popup-hide" /> 오늘 하루 보지 않기</label>
          <button class="link-btn" data-close>닫기</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    let lastFocus = null;
    const close = () => {
      if (document.getElementById("popup-hide").checked) {
        const tomorrow = new Date(); tomorrow.setHours(24, 0, 0, 0);
        Store.set("popupHideUntil", tomorrow.getTime());
      }
      modal.classList.remove("show");
      setTimeout(() => { modal.hidden = true; }, 250);
      document.removeEventListener("keydown", onKey);
      if (lastFocus) lastFocus.focus({ preventScroll: true });
    };
    const onKey = (ev) => {
      if (ev.key === "Escape") close();
      if (ev.key === "Tab") { // 팝업 안에서만 포커스 이동
        const f = [...modal.querySelectorAll("button, a, input")];
        const first = f[0], last = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
      }
    };
    modal.addEventListener("click", (ev) => { if (ev.target === modal || ev.target.closest("[data-close]")) close(); });
    setTimeout(() => {
      lastFocus = document.activeElement;
      modal.hidden = false;
      requestAnimationFrame(() => modal.classList.add("show"));
      modal.querySelector(".btn-primary").focus({ preventScroll: true });
      document.addEventListener("keydown", onKey);
    }, P.delay || 1500);
  }

  /* ── 첫 방문 환영 폭죽 ─────────────────────── */
  if (C.welcome && C.welcome.confetti && !Store.get("visited", false)) {
    Store.set("visited", true);
    setTimeout(() => { confetti(); toast(C.welcome.message); }, 500);
  }

  // 주소에 #섹션이 있으면 해당 위치로 이동
  if (location.hash) {
    const t = document.getElementById(location.hash.slice(1));
    if (t) window.scrollTo(0, t.offsetTop - header.offsetHeight + 1);
  }
})();
  </script>
</body>
</html>
